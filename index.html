<style>
  :root{
    --bg: #1C1F26;
    --bg-panel: #242832;
    --bg-panel-2: #2C313D;
    --paper: #F7F5F0;
    --paper-line: #E4DFD3;
    --ink: #2B2925;
    --ink-soft: #6B6658;
    --accent: #14B8A6;
    --accent-dark: #0D9488;
    --border: #3A4050;
    --status-new: #3B82F6;
    --status-new-bg: #16233E;
    --status-progress: #F59E0B;
    --status-progress-bg: #3A2A0C;
    --status-ready: #22C55E;
    --status-ready-bg: #16321F;
    --status-done: #9AA0AC;
    --status-done-bg: #2A2E37;
    --danger: #E5484D;

    /* Общая система контраста текста */
    --text-main: #E8E6E0;
    --text-secondary: #D8D5CC;
    --text-muted: #9CA3AF;
    --text-subtle: #7C8290;
    --text-faint: #6B7280;
    --text-placeholder: #5C6270;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color:var(--text-main);
    font-family: 'Golos Text', -apple-system, sans-serif;
    min-height: 100vh;
  }

  .app{ max-width: 1320px; margin: 0 auto; padding: 28px 24px 64px; }

  /* Header */
  .header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom: 28px; padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
    gap: 20px; flex-wrap: wrap;
  }
  .header-title{ display:flex; align-items:center; gap:14px; }
  .header-mark{
    width:44px; height:44px; border-radius:8px;
    background: var(--accent); color:#1C1110;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .header h1{ font-size:21px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .header .sub{ font-size:13px; color:var(--text-muted); margin-top:3px; }
  .header-actions-stack{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:7px;
  }
  .header-clock{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:220px;
    padding:2px 0;
    border:none;
    background:transparent;
    box-shadow:none;
  }
  .header-clock::before{ content:none; }
  .clock-screen{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    min-height:48px;
    width:100%;
  }
  .seg-digit{
    position:relative;
    width:25px;
    height:44px;
    flex:0 0 25px;
  }
  .seg{
    position:absolute;
    background:transparent;
    opacity:0;
    box-shadow:none;
    transition:opacity .08s ease, background .08s ease, box-shadow .08s ease;
  }
  .seg.h{
    width:17px;
    height:5px;
    left:4px;
    clip-path:polygon(15% 0,85% 0,100% 50%,85% 100%,15% 100%,0 50%);
  }
  .seg.v{
    width:5px;
    height:17px;
    clip-path:polygon(50% 0,100% 15%,100% 85%,50% 100%,0 85%,0 15%);
  }
  .seg-a{ top:0; }
  .seg-g{ top:19px; }
  .seg-d{ bottom:0; }
  .seg-f{ left:0; top:4px; }
  .seg-b{ right:0; top:4px; }
  .seg-e{ left:0; bottom:4px; }
  .seg-c{ right:0; bottom:4px; }
  .seg-colon{
    position:relative;
    width:8px;
    height:44px;
    flex:0 0 8px;
  }
  .seg-colon::before,
  .seg-colon::after{
    content:'';
    position:absolute;
    left:2px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#F7F9FB;
    box-shadow:0 0 6px rgba(255,255,255,.58);
  }
  .seg-colon::before{ top:12px; }
  .seg-colon::after{ bottom:12px; }

  .seg-digit.d0 .seg-a,.seg-digit.d0 .seg-b,.seg-digit.d0 .seg-c,.seg-digit.d0 .seg-d,.seg-digit.d0 .seg-e,.seg-digit.d0 .seg-f,
  .seg-digit.d1 .seg-b,.seg-digit.d1 .seg-c,
  .seg-digit.d2 .seg-a,.seg-digit.d2 .seg-b,.seg-digit.d2 .seg-g,.seg-digit.d2 .seg-e,.seg-digit.d2 .seg-d,
  .seg-digit.d3 .seg-a,.seg-digit.d3 .seg-b,.seg-digit.d3 .seg-g,.seg-digit.d3 .seg-c,.seg-digit.d3 .seg-d,
  .seg-digit.d4 .seg-f,.seg-digit.d4 .seg-g,.seg-digit.d4 .seg-b,.seg-digit.d4 .seg-c,
  .seg-digit.d5 .seg-a,.seg-digit.d5 .seg-f,.seg-digit.d5 .seg-g,.seg-digit.d5 .seg-c,.seg-digit.d5 .seg-d,
  .seg-digit.d6 .seg-a,.seg-digit.d6 .seg-f,.seg-digit.d6 .seg-g,.seg-digit.d6 .seg-e,.seg-digit.d6 .seg-c,.seg-digit.d6 .seg-d,
  .seg-digit.d7 .seg-a,.seg-digit.d7 .seg-b,.seg-digit.d7 .seg-c,
  .seg-digit.d8 .seg-a,.seg-digit.d8 .seg-b,.seg-digit.d8 .seg-c,.seg-digit.d8 .seg-d,.seg-digit.d8 .seg-e,.seg-digit.d8 .seg-f,.seg-digit.d8 .seg-g,
  .seg-digit.d9 .seg-a,.seg-digit.d9 .seg-b,.seg-digit.d9 .seg-c,.seg-digit.d9 .seg-d,.seg-digit.d9 .seg-f,.seg-digit.d9 .seg-g{
    opacity:1;
    background:#F7F9FB;
    box-shadow:0 0 6px rgba(255,255,255,.52);
  }
  [data-theme="light"] .seg-digit.d0 .seg-a,[data-theme="light"] .seg-digit.d0 .seg-b,[data-theme="light"] .seg-digit.d0 .seg-c,[data-theme="light"] .seg-digit.d0 .seg-d,[data-theme="light"] .seg-digit.d0 .seg-e,[data-theme="light"] .seg-digit.d0 .seg-f,
  [data-theme="light"] .seg-digit.d1 .seg-b,[data-theme="light"] .seg-digit.d1 .seg-c,
  [data-theme="light"] .seg-digit.d2 .seg-a,[data-theme="light"] .seg-digit.d2 .seg-b,[data-theme="light"] .seg-digit.d2 .seg-g,[data-theme="light"] .seg-digit.d2 .seg-e,[data-theme="light"] .seg-digit.d2 .seg-d,
  [data-theme="light"] .seg-digit.d3 .seg-a,[data-theme="light"] .seg-digit.d3 .seg-b,[data-theme="light"] .seg-digit.d3 .seg-g,[data-theme="light"] .seg-digit.d3 .seg-c,[data-theme="light"] .seg-digit.d3 .seg-d,
  [data-theme="light"] .seg-digit.d4 .seg-f,[data-theme="light"] .seg-digit.d4 .seg-g,[data-theme="light"] .seg-digit.d4 .seg-b,[data-theme="light"] .seg-digit.d4 .seg-c,
  [data-theme="light"] .seg-digit.d5 .seg-a,[data-theme="light"] .seg-digit.d5 .seg-f,[data-theme="light"] .seg-digit.d5 .seg-g,[data-theme="light"] .seg-digit.d5 .seg-c,[data-theme="light"] .seg-digit.d5 .seg-d,
  [data-theme="light"] .seg-digit.d6 .seg-a,[data-theme="light"] .seg-digit.d6 .seg-f,[data-theme="light"] .seg-digit.d6 .seg-g,[data-theme="light"] .seg-digit.d6 .seg-e,[data-theme="light"] .seg-digit.d6 .seg-c,[data-theme="light"] .seg-digit.d6 .seg-d,
  [data-theme="light"] .seg-digit.d7 .seg-a,[data-theme="light"] .seg-digit.d7 .seg-b,[data-theme="light"] .seg-digit.d7 .seg-c,
  [data-theme="light"] .seg-digit.d8 .seg-a,[data-theme="light"] .seg-digit.d8 .seg-b,[data-theme="light"] .seg-digit.d8 .seg-c,[data-theme="light"] .seg-digit.d8 .seg-d,[data-theme="light"] .seg-digit.d8 .seg-e,[data-theme="light"] .seg-digit.d8 .seg-f,[data-theme="light"] .seg-digit.d8 .seg-g,
  [data-theme="light"] .seg-digit.d9 .seg-a,[data-theme="light"] .seg-digit.d9 .seg-b,[data-theme="light"] .seg-digit.d9 .seg-c,[data-theme="light"] .seg-digit.d9 .seg-d,[data-theme="light"] .seg-digit.d9 .seg-f,[data-theme="light"] .seg-digit.d9 .seg-g{
    background:#111827;
    box-shadow:none;
  }
  [data-theme="light"] .seg-colon::before,
  [data-theme="light"] .seg-colon::after{
    background:#111827;
    box-shadow:none;
  }
  .header-actions{ display:flex; gap:10px; align-items:center; flex-wrap: wrap; }

  .btn{
    font-family:inherit; font-size:14px; font-weight:500;
    padding: 10px 18px; border-radius: 8px; cursor:pointer;
    border:1px solid var(--border); background: var(--bg-panel-2); color:var(--text-main);
    transition: background .12s ease, border-color .12s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn:hover{ background:#363C49; border-color:#4A5163; }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--accent); border-color: var(--accent); color:#1C1110; font-weight:600; }
  .btn-primary:hover{ background:#2DD4BF; border-color:#2DD4BF; }
  #detailEdit:disabled{ opacity:.48; cursor:not-allowed; filter:saturate(.45); }
  .btn-ghost{ background:transparent; }
  .btn-danger{ color: var(--danger); border-color: rgba(229,72,77,0.35); background:transparent; }
  .btn-danger:hover{ background: rgba(229,72,77,0.1); }
  .btn-sm{ padding:6px 12px; font-size:13px; }

  /* Toolbar */
  .toolbar{
    display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap; align-items:center;
  }
  .search-wrap{ position:relative; flex:1; min-width:220px; max-width:380px; }
  .search-wrap input{
    width:100%; padding:10px 14px 10px 38px; border-radius:8px;
    border:1px solid var(--border); background: var(--bg-panel-2); color:var(--text-main);
    font-family:inherit; font-size:14px;
  }
  .search-wrap input::placeholder{ color:var(--text-subtle); }
  .search-wrap input:focus{ outline:none; border-color: var(--accent); }
  .search-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-subtle); font-size:15px; }

  .stat-pill{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-muted);
    background: var(--bg-panel-2); border:1px solid var(--border);
    padding:9px 13px; border-radius:8px; white-space:nowrap;
  }
  .stat-pill b{ color:var(--text-main); font-weight:600; }

  /* Board */
  .board{
    display:grid; grid-template-columns: repeat(4, minmax(0,1fr));
    gap:16px;
  }
  @media (max-width: 980px){ .board{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 600px){ .board{ grid-template-columns: 1fr; } }

  .column{
    background: var(--bg-panel);
    border-radius:12px;
    border:1px solid var(--border);
    padding:14px;
    min-height: 200px;
    display:flex; flex-direction:column; gap:12px;
  }
  .column.dragover{ border-color: var(--accent); background: #292430; }

  .column-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 4px 0; }
  .column-head-left{ display:flex; align-items:center; gap:8px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot-new{ background: var(--status-new); }
  .dot-progress{ background: var(--status-progress); }
  .dot-ready{ background: var(--status-ready); }
  .dot-done{ background: var(--status-done); }
  .column-title{ font-size:13px; font-weight:600; letter-spacing:0.02em; text-transform:uppercase; color:var(--text-secondary); }
  .column-count{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-muted);
    background: var(--bg-panel-2); padding:2px 8px; border-radius:20px; border:1px solid var(--border);
  }

  .cards{ display:flex; flex-direction:column; gap:10px; min-height: 60px; }
  .empty-col{ font-size:12.5px; color:var(--text-faint); padding:18px 6px; text-align:center; border:1px dashed var(--border); border-radius:8px; }

  /* Order card — styled like a work-order slip */
  .order-card{
    background: var(--paper);
    color: var(--ink);
    border-radius:8px;
    padding:13px 14px 12px;
    cursor:grab;
    position:relative;
    border-left: 4px solid var(--accent);
    box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }
  .order-card.status-new{ border-left-color: var(--status-new); }
  .order-card.status-progress{ border-left-color: var(--status-progress); }
  .order-card.status-ready{ border-left-color: var(--status-ready); }
  .order-card.status-done{ border-left-color: var(--status-done); }
  .order-card:active{ cursor:grabbing; }
  .order-card.dragging{ opacity:0.4; }

  .oc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
  .oc-num{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:11.5px; color: var(--accent-dark); }
  .oc-date{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--ink-soft); white-space:nowrap; }
  .oc-client{ font-size:14.5px; font-weight:600; margin-bottom:2px; line-height:1.25; }
  .oc-car{ font-size:12.5px; color: var(--ink-soft); margin-bottom:8px; }
  .oc-car span{ font-family:'JetBrains Mono', monospace; }
  .oc-bottom{
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:6px;
    border-top:1px dashed var(--paper-line); padding-top:8px; margin-top:2px;
    min-width:0;
  }
  .oc-master{
    font-size:12px; color:var(--ink-soft);
    flex:1 1 100%; min-width:0;
    overflow:visible; text-overflow:clip; white-space:normal;
    overflow-wrap:anywhere; line-height:1.25;
  }
  .oc-actions{
    display:flex; align-items:center; justify-content:flex-end;
    gap:5px; flex:0 0 100%; width:100%; min-width:0;
  }
  .oc-sum{
    font-family:'JetBrains Mono', monospace; font-weight:700;
    font-size:13px; letter-spacing:-0.035em;
    white-space:nowrap; flex-shrink:0;
  }
  .oc-assign-btn{
    font-size:11px; padding:3px 7px; border-radius:5px;
    border:1px solid var(--paper-line); background:transparent;
    color:var(--ink-soft); cursor:pointer; font-family:inherit;
    line-height:1.4; white-space:nowrap; flex-shrink:0;
  }
  .oc-assign-btn:hover{ background:var(--paper-line); color:var(--ink); }
  .oc-status-btn{
    width:26px; height:26px; border-radius:6px;
    border:1px solid var(--paper-line); background:transparent;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; padding:0;
  }
  .oc-status-btn:hover{ background:var(--paper-line); }
  .assign-popup{
    position:fixed; z-index:200;
    background:var(--bg-panel); border:1px solid var(--border);
    border-radius:10px; padding:6px;
    box-shadow:0 6px 24px rgba(0,0,0,0.4); min-width:170px;
  }
  .assign-popup-label{
    font-size:11px; color:var(--text-subtle); padding:4px 8px 6px;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .assign-popup-item{
    padding:8px 10px; border-radius:6px; cursor:pointer;
    font-size:13.5px; color:var(--text-secondary);
  }
  .assign-popup-item:hover{ background:var(--bg-panel-2); }
  .assign-popup-item.active{ color:var(--accent); font-weight:600; }

  .issued-pin-overlay{
    position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(10,11,14,.68); backdrop-filter:blur(3px);
  }
  .issued-pin-modal{
    width:100%; max-width:320px; box-sizing:border-box; padding:22px 20px 18px;
    border:1px solid var(--border); border-radius:14px; background:var(--bg-panel);
    box-shadow:0 22px 60px rgba(0,0,0,.42); text-align:center;
  }
  .issued-pin-icon{
    width:42px; height:42px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center;
    border-radius:12px; background:rgba(20,184,166,.12); font-size:20px;
  }
  .issued-pin-title{ font-size:16px; font-weight:700; color:var(--text-main); }
  .issued-pin-desc{ margin:6px 0 16px; font-size:12.5px; line-height:1.45; color:var(--text-subtle); }
  .issued-pin-input{
    width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid var(--border); border-radius:9px;
    background:var(--bg-panel-2); color:var(--text-main); font-family:'JetBrains Mono',monospace;
    font-size:22px; letter-spacing:.42em; text-align:center; outline:none;
  }
  .issued-pin-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(20,184,166,.12); }
  .issued-pin-error{ min-height:17px; margin:7px 0 10px; color:#ef4444; font-size:12px; }
  .issued-pin-actions{ display:flex; justify-content:center; gap:8px; }
  .issued-pin-actions .btn{ flex:1; justify-content:center; }
  @media(max-width:380px){ .issued-pin-modal{ padding:20px 16px 16px; } }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(10,11,14,0.7);
    display:flex; align-items:flex-start; justify-content:center;
    padding: 36px 16px; z-index:100; overflow-y:auto;
  }
  .modal{
    background: var(--bg-panel); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:760px; padding:0; overflow:hidden;
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 24px; border-bottom:1px solid var(--border);
  }
  .modal-head h2{ font-size:17px; font-weight:600; margin:0; }
  .modal-close{ background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer; line-height:1; padding:4px; }
  .modal-close:hover{ color:var(--text-main); }
  .modal-body{ padding:22px 24px; max-height:72vh; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-top:1px solid var(--border); gap:10px; flex-wrap:wrap; }

  /* Order form — compact document strip in header */
  .of-dochead{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:14px 24px; border-bottom:1px solid var(--border);
  }
  .of-doc-num{ display:flex; align-items:center; gap:8px; }
  .of-doc-num label{ font-size:11.5px; color:var(--text-subtle); }
  .of-doc-num input{
    font-family:'JetBrains Mono', monospace; font-size:13.5px; font-weight:600; color: var(--accent);
    background: var(--bg-panel-2); border:1px solid var(--border); border-radius:6px; padding:5px 9px; width:110px;
  }
  .of-doc-num input:focus{ outline:none; border-color: var(--accent); }
  .of-doc-date{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted); }
  .of-doc-date input{
    background: var(--bg-panel-2); border:1px solid var(--border); border-radius:6px; padding:5px 9px;
    color:var(--text-main); font-size:12.5px; font-family:inherit; width:132px;
  }
  .of-doc-date input:focus{ outline:none; border-color: var(--accent); }

  /* Order form — sidebar navigation */
  .modal-body.of-body{ padding:0; max-height:72vh; overflow:hidden; display:flex; align-items:stretch; }
  .of-nav{
    width:176px; flex-shrink:0; border-right:1px solid var(--border);
    padding:18px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;
  }
  .of-nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    font-size:13px; color:var(--text-subtle); cursor:pointer;
  }
  .of-nav-item:hover{ color:var(--text-secondary); }
  .of-num{

  .stock-table{ width:100%; border-collapse:collapse; }

  .breadcrumb{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); margin-bottom:16px; }
  .breadcrumb a{ color:var(--text-muted); cursor:pointer; text-decoration:none; }
  .breadcrumb a:hover{ color: var(--accent); }
  .breadcrumb .sep{ color:#4A5163; }
  .breadcrumb .current{ color:var(--text-main); font-weight:500; }
  .autofill-hint{ font-size:12px; color: var(--accent); margin-top:4px; display:flex; align-items:center; gap:5px; }

  /* Clients */
  .clients-toolbar{ display:flex; gap:12px; margin-bottom:16px; align-items:center; }
  .clients-search{ position:relative; flex:1; max-width:380px; }
  .clients-search input{
    width:100%; padding:10px 14px 10px 38px; border-radius:8px;
    border:1px solid var(--border); background: var(--bg-panel-2); color:var(--text-main);
    font-family:inherit; font-size:14px;
  }
  .clients-search input:focus{ outline:none; border-color: var(--accent); }
  .clients-search .search-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-subtle); font-size:15px; }
  .client-list{ display:flex; flex-direction:column; gap:10px; }
  .client-row{
    background: var(--bg-panel); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:14px;
  }
  .client-row:hover{ border-color:#4A5163; background:#272C37; }
  .client-row-main{ min-width:0; }
  .client-row-name{ font-size:15px; font-weight:600; margin-bottom:3px; }
  .client-row-phone{ font-size:12.5px; color:var(--text-muted); font-family:'JetBrains Mono', monospace; }
  .client-row-cars{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }
  .client-row-stats{ display:flex; gap:18px; flex-shrink:0; text-align:right; }
  .client-row-stat .num{ font-family:'JetBrains Mono', monospace; font-size:16px; font-weight:700; color: var(--accent); }
  .client-row-stat .lbl{ font-size:10.5px; color:var(--text-subtle); text-transform:uppercase; letter-spacing:0.03em; margin-top:2px; }
  .clients-empty{ text-align:center; padding:60px 0; color:var(--text-subtle); font-size:14px; }

  .client-detail-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
  .client-detail-name{ font-size:19px; font-weight:700; margin-bottom:4px; }
  .client-detail-phone{ font-size:13.5px; color:var(--text-muted); font-family:'JetBrains Mono', monospace; }
  .car-card{ background: var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .car-card-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
  .car-card-title{ font-size:15px; font-weight:600; }
  .car-card-meta{ font-size:12.5px; color:var(--text-muted); margin-top:3px; }
  .car-card-meta span{ font-family:'JetBrains Mono', monospace; }
  .car-card-badge{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--accent); background: rgba(20,184,166,0.1); padding:4px 10px; border-radius:20px; border:1px solid rgba(20,184,166,0.3); white-space:nowrap; }
  .visit-table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  .visit-table th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-subtle); padding:6px 8px; border-bottom:1px solid var(--border); }
  .visit-table td{ padding:8px 8px; border-bottom:1px solid var(--border); }
  .visit-table tr:last-child td{ border-bottom:none; }
  .visit-table td.num{ font-family:'JetBrains Mono', monospace; text-align:right; }
  .visit-table .visit-link{ color: var(--accent); cursor:pointer; }
  .visit-table .visit-link:hover{ text-decoration:underline; }
  .mileage-warning{ color: var(--danger); font-size:11px; margin-left:6px; }

  /* Line type toggle + assignees */
  .line-type-toggle{ display:flex; gap:4px; }
  .line-type-btn{
    font-size:11px; padding:5px 9px; border-radius:6px; border:1px solid var(--border);
    background: var(--bg-panel-2); color:var(--text-muted); cursor:pointer; font-family:inherit;
  }
  .line-type-btn.active{ background: rgba(20,184,166,0.12); border-color: var(--accent); color: var(--accent); }
  .line-assignees{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px 0 4px 0; }
  .assignee-select{
    padding:7px 10px; border-radius:6px; border:1px solid var(--border); background: var(--bg-panel-2);
    color:var(--text-main); font-family:inherit; font-size:12.5px; max-width:160px;
  }
  .assignee-select:focus{ outline:none; border-color: var(--accent); }
  .line-block{ background: var(--bg-panel-2); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; }
  .line-commission-hint{ font-size:11.5px; color:var(--text-subtle); padding-top:2px; }
  .field.required label::after{ content:' *'; color: var(--accent); }


  /* Line items (works / parts) */
  .lines-columns{ display:grid; grid-template-columns: 1fr 1fr; gap:18px; align-items:start; }
  @media (max-width:760px){ .lines-columns{ grid-template-columns: 1fr; } }
  .lines-column{ min-width:0; }
  .lines{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .line-row{
    display:grid; grid-template-columns: 1fr 60px 90px 80px; gap:6px; align-items:center;
  }
  @media (max-width:760px){ .line-row{ grid-template-columns: 1fr 70px 110px 90px; } }
  @media (max-width:560px){ .line-row{ grid-template-columns: 1fr; } }
  .line-row input{
    padding:8px 10px; border-radius:6px; border:1px solid var(--border);
    background: var(--bg-panel-2); color:var(--text-main); font-family:inherit; font-size:13.5px;
    min-width:0;
  }
  .line-row input:focus{ outline:none; border-color: var(--accent); }
  .line-row .line-sum{
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--text-secondary); text-align:right; padding-right:4px;
  }
  .line-row.part-line-row{
    grid-template-columns:minmax(105px,1fr) 50px 104px 120px 72px;
  }
  .line-row.part-line-row .part-cost-input,
  .line-row.part-line-row .part-sell-input{
    font-family:'JetBrains Mono', monospace;
    font-variant-numeric:tabular-nums;
  }
  @media (max-width:760px){
    .line-row.part-line-row{ grid-template-columns:minmax(150px,1fr) 64px 118px 132px 90px; }
  }
  @media (max-width:640px){
    .line-row.part-line-row{ grid-template-columns:1fr 1fr; }
    .line-row.part-line-row input[data-field="name"]{ grid-column:1 / -1; }
    .line-row.part-line-row .line-sum{ grid-column:1 / -1; text-align:right; }
  }
  .line-remove{
    background:transparent; border:none; color:var(--text-subtle); cursor:pointer; font-size:17px;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:6px;
  }
  .line-remove:hover{ color: var(--danger); background: rgba(229,72,77,0.1); }
  .line-head{
    display:grid; grid-template-columns: 1fr 60px 90px 80px; gap:6px;
    font-size:11px; color:var(--text-subtle); padding:0 0 2px; text-transform:uppercase; letter-spacing:0.03em;
  }
  @media (max-width:760px){ .line-head{ grid-template-columns: 1fr 70px 110px 90px; } }
  @media (max-width:560px){ .line-head{ display:none; } }
  .line-block-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .add-line-btn{
    font-size:13px; color: var(--accent); background:transparent; border:1px dashed var(--border);
    padding:8px; width:100%; border-radius:7px; cursor:pointer; font-family:inherit;
  }
  .add-line-btn:hover{ border-color: var(--accent); background: rgba(20,184,166,0.06); }

  .total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; background: var(--bg-panel-2); border-radius:8px; margin-top:14px;
  }
  .total-row .label{ font-size:13.5px; color:var(--text-secondary); }
  .total-row .value{ font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700; color: var(--accent); }

  .status-select-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .status-chip{
    padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer;
    border:1px solid var(--border); background: var(--bg-panel-2); color:var(--text-muted);
    display:flex; align-items:center; gap:7px;
  }
  .status-chip.active{ color:var(--text-main); border-color: currentColor; }
  .status-chip[data-status="new"].active{ background: var(--status-new-bg); border-color: var(--status-new); color:#9DC2FA; }
  .status-chip[data-status="progress"].active{ background: var(--status-progress-bg); border-color: var(--status-progress); color:#FBCB7A; }
  .status-chip[data-status="ready"].active{ background: var(--status-ready-bg); border-color: var(--status-ready); color:#86E6AC; }
  .status-chip[data-status="done"].active{ background: var(--status-done-bg); border-color: var(--status-done); color:#C9CDD4; }

  .signature-box{
    border:1px solid var(--border); border-radius:8px; background:#fff; height:120px;
    cursor:crosshair; touch-action:none;
  }
  .sig-controls{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .sig-hint{ font-size:12px; color:var(--text-subtle); }

  /* View-only order detail */
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
  @media (max-width:560px){ .detail-grid{ grid-template-columns:1fr; } }
  .detail-block-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-subtle); margin-bottom:6px; }
  .detail-block-value{ font-size:14.5px; color:var(--text-main); }
  .detail-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .detail-table th{ text-align:left; font-size:11.5px; text-transform:uppercase; color:var(--text-subtle); padding:6px 8px; border-bottom:1px solid var(--border); }
  .detail-table td{ padding:8px 8px; border-bottom:1px solid var(--border); color:var(--text-main); }
  .detail-table td.num{
    font-family:'JetBrains Mono', monospace; text-align:right;
    white-space:nowrap; word-break:keep-all;
  }
  .detail-table th:nth-child(2),
  .detail-table th:nth-child(3),
  .detail-table th:nth-child(4){ white-space:nowrap; }
  .detail-table td:first-child{ overflow-wrap:anywhere; }
  .detail-lines-group{
    margin-top:12px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg-panel-2);
  }
  .detail-lines-group + .detail-lines-group{ margin-top:10px; }
  .detail-lines-title{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    font-size:13px;
    font-weight:700;
    color:var(--text-main);
  }
  .detail-count{
    min-width:22px;
    height:22px;
    padding:0 6px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text-subtle);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:600;
  }
  .detail-table-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .detail-work-table{ min-width:620px; }
  .detail-parts-table{ min-width:460px; }
  .detail-subtotal{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:8px;
    padding-top:9px;
    border-top:1px solid var(--border);
  }
  .detail-subtotal .label{
    font-size:12.5px;
    color:var(--text-secondary);
    font-weight:600;
  }
  .detail-subtotal .value{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:700;
    color:var(--accent);
    white-space:nowrap;
  }
  .detail-sig{ background:#fff; border-radius:8px; padding:8px; margin-top:6px; }

  /* Денежные значения по всему интерфейсу: без переноса числа и ₽ */
  .oc-sum,
  .moc-sum,
  .detail-table td.num,
  .detail-subtotal .value,
  .line-sum,
  .total-row .value,
  .stock-num,
  .pricelist-price,
  .pay-amount,
  .pay-hero-amount,
  .sw-amount,
  .mds-amount,
  .mds-revenue-amount,
  .crm-period-row .val,
  .client-stat .num,
  .payroll-card .amount,
  .stat-pill b,
  #qTotal,
  #workLinesTotal,
  #partLinesTotal,
  #formTotal{
    white-space:nowrap;
    word-break:keep-all;
    font-variant-numeric:tabular-nums;
  }
  .total-row{ min-width:0; gap:12px; }
  .total-row .label{ min-width:0; }
  .total-row .value{
    flex:0 1 auto;
    min-width:0;
    font-size:clamp(14px, 3.8vw, 20px);
    letter-spacing:-0.025em;
  }
  .pay-hero{ min-width:0; }
  .pay-hero-amount{
    max-width:100%;
    font-size:clamp(20px, 5vw, 34px);
    letter-spacing:-0.03em;
  }
  .crm-period-row{ gap:10px; min-width:0; }
  .crm-period-row .lbl{ min-width:0; }
  .crm-period-row .val{
    flex-shrink:1;
    font-size:clamp(13px, 3.5vw, 17px);
    letter-spacing:-0.025em;
  }

  .toast{
    position:fixed; bottom:24px; right:24px; background: var(--bg-panel-2); border:1px solid var(--border);
    color:var(--text-main); padding:12px 18px; border-radius:8px; font-size:14px; z-index:200;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    animation: toastIn .18s ease;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  .loading-state{ text-align:center; padding:60px 0; color:var(--text-subtle); font-size:14px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#3A4050; border-radius:6px; }

  /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */
  @media (max-width: 640px){

    /* Приложение */
    .app{ padding: 12px 10px 80px; }

    /* Шапка */
    .header{ flex-direction:column; align-items:stretch; gap:10px; padding-bottom:12px; margin-bottom:16px; }
    .header h1{ font-size:17px; }
    .header .sub{ font-size:12px; }
    .header-actions-stack{ align-items:stretch; }
    .header-clock{
      min-width:0;
      width:auto;
      max-width:none;
      align-self:flex-end;
      padding:0;
    }
    .clock-screen{ min-height:42px; gap:3px; }
    .seg-digit{
      width:22px;
      height:40px;
      flex-basis:22px;
    }
    .seg.h{ width:15px; height:4px; left:3.5px; }
    .seg.v{ width:4px; height:15px; }
    .seg-g{ top:18px; }
    .seg-f,.seg-b{ top:4px; }
    .seg-e,.seg-c{ bottom:4px; }
    .seg-colon{ height:40px; width:7px; flex-basis:7px; }
    .seg-colon::before,
    .seg-colon::after{ width:5px; height:5px; left:1px; }
    .seg-colon::before{ top:11px; }
    .seg-colon::after{ bottom:11px; }
    .header-actions{ flex-wrap:wrap; gap:8px; }
    .header-actions .btn{ flex:1; justify-content:center; min-width:calc(50% - 4px); }
    .header-actions .btn-primary{ flex:100%; }
    #statTotal, #statSum{ flex:1; text-align:center; font-size:11px; padding:7px 8px; }

    /* Вкладки: горизонтальный скролл */
    .tabs{ overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; padding-bottom:2px; gap:0; }
    .tabs::-webkit-scrollbar{ display:none; }
    .tab-btn{ white-space:nowrap; flex-shrink:0; font-size:13px; margin-right:10px; padding:10px 2px; }

    /* Тулбар */
    .toolbar{ flex-direction:column; gap:8px; margin-bottom:14px; }
    .search-wrap{ max-width:100%; min-width:0; }
    #boardToolbar .btn{ width:100%; justify-content:center; }

    /* Доска: горизонтальный скролл со snap */
    .board{
      display:flex !important; flex-direction:row;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      scroll-snap-type:x mandatory;
      gap:10px; padding-bottom:10px;
      grid-template-columns:unset !important;
    }
    .board::-webkit-scrollbar{ height:3px; }
    .column{ min-width:82vw; flex-shrink:0; scroll-snap-align:start; }

    /* Карточка наряда */
    .order-card{ padding:11px 12px 10px; }
    .oc-client{ font-size:13.5px; }
    .oc-actions{ gap:4px; }
    .oc-sum{ font-size:12px; }
    .oc-assign-btn{ padding-left:5px; padding-right:5px; }

    /* Модальные окна: нижняя шторка */
    .modal-overlay{ padding:0; align-items:flex-end; }
    .modal{ border-radius:18px 18px 0 0; max-height:93vh; }
    .modal-body{ max-height:calc(93vh - 120px); padding:16px; }
    .modal-head{ padding:14px 16px; }
    .modal-foot{ padding:12px 16px; flex-direction:column-reverse; }
    .modal-foot > div{ display:flex; gap:8px; width:100%; }
    .modal-foot > div .btn{ flex:1; justify-content:center; }
    .modal-foot > .btn-danger{ width:100%; }

    /* Форма наряда: боковая навигация -> горизонтальная полоса сверху */
    .modal-body.of-body{ flex-direction:column; max-height:calc(93vh - 120px); }
    .of-nav{
      width:100%; flex-direction:row; overflow-x:auto; -webkit-overflow-scrolling:touch;
      border-right:none; border-bottom:1px solid var(--border); white-space:nowrap; padding:10px 12px;
    }
    .of-nav-item{ flex-shrink:0; }
    .of-scroll{ padding:16px; }
    .of-dochead{ padding:10px 16px; gap:10px; }
    .of-doc-num input{ width:92px; }
    .of-doc-date input{ width:112px; }

    /* Сетки форм */
    .grid2, .grid3{ grid-template-columns:1fr !important; }
    .lines-columns{ grid-template-columns:1fr !important; }
    .detail-grid{ grid-template-columns:1fr; }

    /* Таблицы: горизонтальный скролл */
    .staff-table, .pricelist-table, .stock-table,
    .visit-table, .detail-table{
      display:block; overflow-x:auto; -webkit-overflow-scrolling:touch;
      white-space:nowrap;
    }
    .staff-table td, .pricelist-table td, .stock-table td,
    .detail-table td{ white-space:normal; }
    .detail-table td.num{
      white-space:nowrap !important;
      font-size:12px;
    }
    .stock-name, .pricelist-name, .staff-name{ white-space:normal; min-width:120px; }
    .stock-table{
      display:table;
      width:100%;
      table-layout:fixed;
      overflow:visible;
      white-space:normal;
    }
    .stock-table th,
    .stock-table td{
      padding:9px 5px;
      vertical-align:middle;
    }
    .stock-table th:nth-child(1),
    .stock-table td:nth-child(1){ width:46%; }
    .stock-table th:nth-child(2),
    .stock-table td:nth-child(2){ width:14%; text-align:center !important; }
    .stock-table th:nth-child(3),
    .stock-table td:nth-child(3){ width:24%; text-align:right !important; }
    .stock-table th:nth-child(5),
    .stock-table td:nth-child(5){ width:16%; }
    .stock-table .stock-sale-col{ display:none; }
    .stock-name{ min-width:0; font-size:13px; line-height:1.2; }
    .stock-sku{ font-size:10px; overflow-wrap:anywhere; }
    .stock-qty{ font-size:13px; }
    .stock-num{ font-size:11.5px; white-space:nowrap !important; }
    .stock-actions{
      gap:3px;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .stock-actions .icon-btn{
      width:25px;
      height:25px;
      min-width:25px;
      padding:0;
      font-size:12px;
    }
    .stock-mobile-qty{ display:none !important; }

    /* CRM */
    .crm-period-grid{ grid-template-columns:1fr; }
    .payroll-summary{ grid-template-columns:1fr; }
    .crm-chart-head{ flex-direction:column; align-items:flex-start; gap:8px; }

    /* Payroll — leaderboard */
    .pay-hero{ padding:18px 18px; }
    .pay-hero-amount{ font-size:26px; }
    .pay-row{ padding:12px; gap:10px; }
    .pay-avatar{ width:32px; height:32px; font-size:11.5px; }
    .pay-name{ font-size:13.5px; }
    .pay-amount{ font-size:14px; }

    /* Клиенты */
    .client-row{ flex-direction:column; align-items:flex-start; gap:8px; }
    .client-row-stats{ width:100%; }
    .clients-toolbar{ flex-direction:column; }
    .clients-search{ max-width:100%; }

    /* Попап исполнителя: нижняя шторка */
    .assign-popup{
      position:fixed !important;
      left:0 !important; right:0 !important;
      bottom:0 !important; top:auto !important;
      border-radius:18px 18px 0 0;
      min-width:0; max-height:70vh; overflow-y:auto;
      padding:10px 10px 24px;
    }
  }

  /* Auth screen */

    transform:translateY(-1px);

  .salary-widget .sw-name{

    --bg-panel-2: #F9FAFB;
    --border: #D1D5DB;

    /* В светлой теме серые тексты должны оставаться хорошо читаемыми */
    --text-main: #111827;
    --text-secondary: #1F2937;
    --text-muted: #374151;
    --text-subtle: #4B5563;
    --text-faint: #4B5563;
    --text-placeholder: #4B5563;
  }
  [data-theme="light"] body{ color: #111827; }
  [data-theme="light"] input,
  [data-theme="light"] select,
  [data-theme="light"] textarea{
    color:#111827;
  }
  [data-theme="light"] input::placeholder,
  [data-theme="light"] textarea::placeholder{
    color:var(--text-placeholder) !important;
    opacity:1;
  }
  [data-theme="light"] input:disabled,
  [data-theme="light"] select:disabled,

  [data-theme="light"] .header .sub{ color:var(--text-faint); }
  [data-theme="light"] .column-title{ color: #374151; }
  [data-theme="light"] .sw-name{ color:var(--text-faint); }

  /* ===== Theme toggle button ===== */
  .theme-toggle{
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:8px; width:34px; height:34px;

  function applyRealtimeChange(payload){
    var eventType = payload && payload.eventType;
    var row = eventType === 'DELETE' ? (payload.old || {}) : (payload.new || {});
    var key = row.key || (payload.old && payload.old.key) || '';
    if(!key){
      scheduleFullRealtimeRefresh();
      return;
    }

    var isDelete = eventType === 'DELETE';
    var id = key.indexOf(':') !== -1 ? key.substring(key.indexOf(':') + 1) : '';

    if(key.indexOf('order:') === 0){
      if(isDelete) removeStateItem('orders', id);
      else upsertStateItem('orders', parseStoredJson(row.value));
    } else if(key.indexOf('staff:') === 0){
      if(isDelete) removeStateItem('staff', id);
      else upsertStateItem('staff', parseStoredJson(row.value));
    } else if(key.indexOf('client:') === 0){
      if(isDelete) removeStateItem('clients', id);
      else upsertStateItem('clients', parseStoredJson(row.value));
    } else if(key.indexOf('car:') === 0){
      if(isDelete) removeStateItem('cars', id);
      else upsertStateItem('cars', parseStoredJson(row.value));
    } else if(key.indexOf('priceitem:') === 0){
      if(isDelete) removeStateItem('priceList', id);
      else upsertStateItem('priceList', parseStoredJson(row.value));
    } else if(key.indexOf('stockitem:') === 0){
      if(isDelete) removeStateItem('stockItems', id);
      else upsertStateItem('stockItems', parseStoredJson(row.value));
    } else if(key === 'meta:stockMarkupPct'){
      if(!isDelete) state.stockMarkupPct = Number(row.value);
    } else if(key === 'company'){
      if(!isDelete){
        var company = parseStoredJson(row.value);
        if(company) state.company = company;
      }
    }

    scheduleRealtimeRender();
  }

  // Find-or-create client & vehicle for a saved order, linking the order to both.
  // Returns { clientId, vehicleId }
  async function upsertClientAndVehicle(order){
    var clientId = order.clientId || null;
    var vehicleId = order.vehicleId || null;

    var existingClient = clientId ? getClientById(clientId) : findClientByPhone(order.clientPhone);
    if(existingClient){
      clientId = existingClient.id;
      var clientChanged = false;
      if(order.clientName && existingClient.name !== order.clientName){ existingClient.name = order.clientName; clientChanged = true; }
      if(order.clientPhone && existingClient.phone !== order.clientPhone){ existingClient.phone = order.clientPhone; clientChanged = true; }
      if(clientChanged){ await saveClient(existingClient); }
    } else if(order.clientName || order.clientPhone){
      var newClient = { id: clientUid(), name: order.clientName||'', phone: order.clientPhone||'', createdAt: Date.now() };
      await saveClient(newClient);
      state.clients.push(newClient);
      clientId = newClient.id;
    }

    var existingCar = vehicleId ? getCarById(vehicleId) : findCarByPlateOrVin(order.plate, order.vin);
    if(existingCar){
      vehicleId = existingCar.id;
      var carChanged = false;
      if(order.carMake && existingCar.carMake !== order.carMake){ existingCar.carMake = order.carMake; carChanged = true; }
      if(order.carModel && existingCar.carModel !== order.carModel){ existingCar.carModel = order.carModel; carChanged = true; }
      if(order.vin && existingCar.vin !== order.vin){ existingCar.vin = order.vin; carChanged = true; }
      if(order.plate && existingCar.plate !== order.plate){ existingCar.plate = order.plate; carChanged = true; }
      if(clientId && existingCar.clientId !== clientId){ existingCar.clientId = clientId; carChanged = true; } // ownership transfer
      if(carChanged){ await saveCar(existingCar); }
    } else if(order.carMake || order.plate || order.vin){
      var newCar = {
        id: carUid(), clientId: clientId,
        carMake: order.carMake||'', carModel: order.carModel||'',
        vin: order.vin||'', plate: order.plate||'',
        createdAt: Date.now()
      };
      await saveCar(newCar);
      state.cars.push(newCar);
      vehicleId = newCar.id;
    }

    return { clientId: clientId, vehicleId: vehicleId };
  }

  // One-time migration: build clients/cars from legacy orders that don't have clientId/vehicleId yet.
  async function migrateLegacyOrdersToClients(){
    try{
      var flagRes = await localStore.get('meta:clientsMigrated');
      if(flagRes && flagRes.value === '1') return;
    }catch(e){ /* not migrated yet */ }

    var ordersNeedingMigration = state.orders.filter(function(o){ return !o.clientId && !o.vehicleId && (o.clientName || o.clientPhone || o.carMake || o.plate || o.vin); });

    for(var i=0;i<ordersNeedingMigration.length;i++){
      var o = ordersNeedingMigration[i];
      var result = await upsertClientAndVehicle(o);
      o.clientId = result.clientId;
      o.vehicleId = result.vehicleId;
      await saveOrder(o);
    }

    try{ await localStore.set('meta:clientsMigrated', '1'); }catch(e){}
  }

  // Visit history for a given vehicle: one row per order, sorted by date ascending.
  function vehicleVisitHistory(vehicleId){

  // Build a map stockItemId -> total qty used, from an order's part lines.
  function stockUsageMap(order){
    var map = {};
    (order && order.lines || []).forEach(function(l){
      if(l.type === 'part' && l.stockItemId){
        map[l.stockItemId] = (map[l.stockItemId] || 0) + (Number(l.qty) || 0);
      }
    });
    return map;
  }

  // Checks whether applying the diff between oldOrder and newLines is possible given current stock.
  // Returns { ok:true } or { ok:false, item: stockItem, needed: number, available: number }
  function checkStockAvailability(oldOrder, newLines){
    var oldMap = stockUsageMap(oldOrder);
    var newMap = stockUsageMap({ lines: newLines });
    var allIds = {};
    Object.keys(oldMap).forEach(function(id){ allIds[id] = true; });
    Object.keys(newMap).forEach(function(id){ allIds[id] = true; });

    for(var id in allIds){
      var diff = (newMap[id]||0) - (oldMap[id]||0);
      if(diff > 0){
        var item = getStockItemById(id);
        var available = item ? Number(item.quantity)||0 : 0;
        if(!item || available < diff){
          return { ok:false, item: item, needed: diff, available: available };
        }
      }
    }
    return { ok:true };
  }

  // Applies the diff between oldOrder and newLines to stock quantities, then persists changed items.
  async function applyStockDiff(oldOrder, newLines){
    var oldMap = stockUsageMap(oldOrder);
    var newMap = stockUsageMap({ lines: newLines });
    var allIds = {};
    Object.keys(oldMap).forEach(function(id){ allIds[id] = true; });
    Object.keys(newMap).forEach(function(id){ allIds[id] = true; });

    for(var id in allIds){
      var diff = (newMap[id]||0) - (oldMap[id]||0);
      if(diff === 0) continue;
      var item = getStockItemById(id);
      if(!item) continue;
      item.quantity = (Number(item.quantity)||0) - diff;
      if(item.quantity < 0) item.quantity = 0;
      await saveStockItem(item);
    }
  }

  // Returns all parts from an order back to stock (used when an order is deleted entirely).
  async function returnOrderStockToInventory(order){
    var usage = stockUsageMap(order);
    for(var id in usage){
      var item = getStockItemById(id);
      if(!item) continue;
      item.quantity = (Number(item.quantity)||0) + usage[id];
      await saveStockItem(item);
    }
  }

  function lineTotal(l){

  function getCommissionPct(staffId){
    var person = getStaffById(staffId);
    if(person && person.commissionPct !== undefined && person.commissionPct !== null && person.commissionPct !== ''){
      return Number(person.commissionPct);
    }
    return DEFAULT_COMMISSION_PCT;
  }

  // Returns array of { staffId, name, amount } commission entries for a single line item
  function calcLineCommissions(l){
    if(l.type !== 'work') return [];
    var assignees = (l.assignees||[]).filter(Boolean);
    if(assignees.length === 0) return [];
    var total = lineTotal(l);
    var sharePerPerson = total / assignees.length;
    return assignees.map(function(staffId){
      var pct = getCommissionPct(staffId);
      return {
        staffId: staffId,
        name: (getStaffById(staffId)||{}).name || 'Бывший сотрудник',
        amount: sharePerPerson * (pct/100),
        pct: pct
      };
    });
  }

  // Returns total commission payable across the whole order
  function calcOrderCommissionTotal(order){
    var sum = 0;
    (order.lines||[]).forEach(function(l){
      calcLineCommissions(l).forEach(function(c){ sum += c.amount; });
    });
    return sum;
  }

  // Returns map staffId -> { name, amount, ordersCount(set) } aggregated across given orders
  function aggregateCommissionsByStaff(orders){
    var map = {};
    orders.filter(function(o){ return o.status === 'done'; }).forEach(function(o){
      (o.lines||[]).forEach(function(l){
        calcLineCommissions(l).forEach(function(c){
          if(!map[c.staffId]){
            map[c.staffId] = { staffId: c.staffId, name: c.name, amount: 0, orderIds: {} };
          }
          map[c.staffId].amount += c.amount;
          map[c.staffId].orderIds[o.id] = true;
        });
      });
    });
    return map;
  }

  function salaryBreakdownForStaff(staffId, orders){
    var source = Array.isArray(orders) ? orders : state.orders;
    var rows = [];
    source.filter(function(o){ return o.status === 'done'; }).forEach(function(o){
      (o.lines||[]).forEach(function(l){
        if(l.type !== 'work') return;
        var amount = 0;
        var pct = null;
        calcLineCommissions(l).forEach(function(c){
          if(c.staffId === staffId){
            amount += c.amount;
            pct = c.pct;
          }
        });
        if(amount > 0){
          rows.push({
            order: o,
            line: l,
            amount: amount,
            pct: pct,
            workTotal: lineTotal(l),
            assigneesCount: Math.max(1, (l.assignees||[]).filter(Boolean).length)
          });
        }
      });
    });
    rows.sort(function(a,b){
      var at = Number(a.order.issuedAt)||Number(a.order.createdAt)||0;
      var bt = Number(b.order.issuedAt)||Number(b.order.createdAt)||0;
      if(bt !== at) return bt - at;
      return String(b.order.dateOut||'').localeCompare(String(a.order.dateOut||''));
    });
    return rows;
  }

  function requestIssuedStatusPassword(){
    return new Promise(function(resolve){
      if(document.getElementById('issuedPinOverlay')){ resolve(false); return; }
      var overlay = document.createElement('div');
      overlay.className = 'issued-pin-overlay';
      overlay.id = 'issuedPinOverlay';
      overlay.innerHTML =
        '<div class="issued-pin-modal" role="dialog" aria-modal="true" aria-labelledby="issuedPinTitle">' +
          '<div class="issued-pin-icon" aria-hidden="true">🔒</div>' +
          '<div class="issued-pin-title" id="issuedPinTitle">Введите пароль</div>' +
          '<div class="issued-pin-desc">Чтобы вернуть наряд из статуса «Выдан», подтвердите действие.</div>' +
          '<form id="issuedPinForm" novalidate>' +
            '<input class="issued-pin-input" id="issuedPinInput" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-label="Четырёхзначный пароль" placeholder="••••">' +
            '<div class="issued-pin-error" id="issuedPinError" role="alert" aria-live="polite"></div>' +
            '<div class="issued-pin-actions">' +
              '<button class="btn btn-ghost btn-sm" id="issuedPinCancel" type="button">Отмена</button>' +
              '<button class="btn btn-primary btn-sm" type="submit">Подтвердить</button>' +
            '</div>' +
          '</form>' +
        '</div>';
      document.body.appendChild(overlay);

      var input = overlay.querySelector('#issuedPinInput');
      var form = overlay.querySelector('#issuedPinForm');
      var error = overlay.querySelector('#issuedPinError');
      var finished = false;

      function finish(approved){
        if(finished) return;
        finished = true;
        document.removeEventListener('keydown', onKeydown);
        overlay.remove();
        resolve(approved);
      }
      function onKeydown(e){
        if(e.key === 'Escape'){
          e.preventDefault();
          finish(false);
        }
      }

      input.addEventListener('input', function(){
        input.value = input.value.replace(/[^0-9]/g,'').slice(0,4);
        error.textContent = '';
      });
      form.addEventListener('submit', function(e){
        e.preventDefault();
        if(!/^\d{4}$/.test(input.value)){
          error.textContent = 'Введите четыре цифры';
          input.focus();
          return;
        }
        if(input.value !== ISSUED_STATUS_PIN){
          error.textContent = 'Неверный пароль. Попробуйте ещё раз.';
          input.value = '';
          input.focus();
          return;
        }
        finish(true);
      });
      overlay.querySelector('#issuedPinCancel').addEventListener('click', function(){ finish(false); });
      overlay.addEventListener('mousedown', function(e){
        if(e.target === overlay) finish(false);
      });
      document.addEventListener('keydown', onKeydown);
      input.focus();
    });
  }

  function showStatusPopup(e, order){
    var existing = document.querySelector('.assign-popup');
    if(existing) existing.remove();

    var popup = document.createElement('div');
    popup.className = 'assign-popup';

    var html = '<div class="assign-popup-label">Статус</div>';
    STATUSES.forEach(function(s){
      var isActive = order.status === s.key;
      html += '<div class="assign-popup-item' + (isActive ? ' active' : '') + '" data-skey="' + s.key + '">' +
        '<span class="dot ' + s.dot + '" style="display:inline-block;margin-right:8px;vertical-align:middle;flex-shrink:0;"></span>' +
        escapeHtml(s.label) + '</div>';
    });
    popup.innerHTML = html;
    document.body.appendChild(popup);

    var btn = e.currentTarget;
    var rect = btn.getBoundingClientRect();
    var left = rect.left;
    var top = rect.bottom + 6;
    if(left + 190 > window.innerWidth) left = window.innerWidth - 196;
    if(top + 220 > window.innerHeight) top = rect.top - 6 - popup.offsetHeight;
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';

    popup.querySelectorAll('.assign-popup-item').forEach(function(item){
      item.addEventListener('click', async function(ev){
        ev.stopPropagation();
        popup.remove();
        var newKey = item.dataset.skey;
        if(newKey === order.status) return;
        await changeStatus(order.id, newKey);
      });
    });

    setTimeout(function(){
      document.addEventListener('click', function close(){
        var p = document.querySelector('.assign-popup');

      });
    }, 0);

  function showAssignPopup(e, order){
    var existing = document.querySelector('.assign-popup');
    if(existing) existing.remove();

    if(state.staff.length === 0){
      showToast('Сначала добавьте сотрудников во вкладке «Сотрудники»');
      return;
    }

    var workLines = (order.lines||[]).filter(function(l){ return l.type === 'work'; });
    var firstLine = workLines[0] || null;
    var currentId1 = firstLine && firstLine.assignees && firstLine.assignees[0] ? firstLine.assignees[0] : null;
    var currentId2 = firstLine && firstLine.assignees && firstLine.assignees[1] ? firstLine.assignees[1] : null;

    var popup = document.createElement('div');
    popup.className = 'assign-popup';

    function staffItems(slot, activeId){
      var html = '<div class="assign-popup-item' + (!activeId ? ' active' : '') + '" data-slot="' + slot + '" data-sid="">— Не назначен</div>';
      state.staff.forEach(function(s){
        html += '<div class="assign-popup-item' + (activeId === s.id ? ' active' : '') + '" data-slot="' + slot + '" data-sid="' + s.id + '">' + escapeHtml(s.name) + '</div>';
      });
      return html;
    }

    popup.innerHTML =
      '<div class="assign-popup-label">Исполнитель 1</div>' + staffItems(1, currentId1) +
      '<div style="height:1px;background:var(--border);margin:6px 0;"></div>' +
      '<div class="assign-popup-label">Исполнитель 2</div>' + staffItems(2, currentId2);

    document.body.appendChild(popup);

    var btn = e.currentTarget;
    var rect = btn.getBoundingClientRect();
    var left = rect.left;
    var top = rect.bottom + 6;
    if(left + 190 > window.innerWidth) left = window.innerWidth - 196;
    if(top + 320 > window.innerHeight) top = rect.top - 6 - popup.offsetHeight;
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';

    popup.querySelectorAll('.assign-popup-item').forEach(function(item){
      item.addEventListener('click', async function(ev){
        ev.stopPropagation();
        popup.remove();
        var sid = item.dataset.sid;
        var slot = Number(item.dataset.slot);
        if(workLines.length === 0){ showToast('В наряде нет работ'); return; }
        workLines.forEach(function(l){
          var a = (l.assignees||[]).slice();
          if(slot === 1){
            a[0] = sid || null;
            if(!sid) a = [];
          } else {
            if(sid){ a[1] = sid; }
            else { a = a[0] ? [a[0]] : []; }
          }
          while(a.length && !a[a.length-1]) a.pop();
          l.assignees = a;
        });
        var ok = await saveOrder(order);
        if(ok){
          var idx = state.orders.findIndex(function(x){ return x.id === order.id; });
          if(idx !== -1) state.orders[idx] = order;
          render();
          showToast(sid ? 'Исполнитель ' + slot + ': ' + ((getStaffById(sid)||{}).name||'') : 'Исполнитель ' + slot + ' снят');
        }
      });
    });

    setTimeout(function(){
      document.addEventListener('click', function close(){
        var p = document.querySelector('.assign-popup');
        if(p) p.remove();
        document.removeEventListener('click', close);
      });
    }, 0);
  }

  function updateHeaderClock(){
    var el = document.getElementById('headerClock');
    if(!el) return;
    var screen = el.querySelector('.clock-screen');
    if(!screen) return;

    var now = new Date();
    var hh = String(now.getHours()).padStart(2,'0');
    var mm = String(now.getMinutes()).padStart(2,'0');
    var ss = String(now.getSeconds()).padStart(2,'0');
    var value = hh + ':' + mm + ':' + ss;

    var html = '';
    for(var i=0;i<value.length;i++){

    el.setAttribute('aria-label', 'Текущее время ' + value);

  var mobileSalaryPeriod = 'day';
  var mobileSalaryView = 'salary';

  function localDateKey(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }

  function mobileSalaryOrders(period){
    var now = new Date();
    var today = localDateKey(now);
    var daysBack = period === 'year' ? 364 : (period === 'month' ? 29 : (period === 'week' ? 6 : 0));
    var fromDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysBack);
    var from = localDateKey(fromDate);

    return state.orders.filter(function(o){
      return o.status === 'done' && o.dateOut && o.dateOut >= from && o.dateOut <= today;
    });
  }

        '<div class="mds-revenue-main">' +

            '<div class="mds-name">' + escapeHtml(r.name) + '</div>' +

            periodButtons() +
          '</div>';
        }).join('') +

    if(mobileSalaryView === 'revenue' && list && revenueSlide){
      requestAnimationFrame(function(){
        list.scrollLeft = revenueSlide.offsetLeft;
      });
    }

    box.onclick = function(e){
      var btn = e.target.closest('[data-salary-period]');
      if(!btn){
        var staffCard = e.target.closest('.mds-staff-card');
        if(staffCard){
          openSalaryDetail(staffCard.dataset.staffid, mobileSalaryOrders(mobileSalaryPeriod));
        }
        return;
      }
      var period = btn.dataset.salaryPeriod;
      if(period !== 'day' && period !== 'week' && period !== 'month' && period !== 'year') return;

      mobileSalaryView = btn.closest('.mds-revenue-card') ? 'revenue' : mobileSalaryView;
      mobileSalaryPeriod = period;

      var nextOrders = mobileSalaryOrders(period);
      var nextMap = aggregateCommissionsByStaff(nextOrders);
      var nextTotal = 0;

      box.querySelectorAll('.mds-staff-card').forEach(function(card){
        var sid = card.dataset.staffid;

      var revenueMetaEl = box.querySelector('.mds-revenue-meta');
      if(revenueMetaEl) revenueMetaEl.textContent = 'Выдано нарядов: ' + nextOrders.length;

      box.querySelectorAll('[data-salary-period]').forEach(function(periodBtn){
        periodBtn.classList.toggle('active', periodBtn.dataset.salaryPeriod === period);
      });
    };

    if(list){
      var scrollTimer = null;
      list.addEventListener('scroll', function(){
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function(){
          if(!revenueSlide) return;
          var threshold = revenueSlide.offsetLeft - (list.clientWidth * 0.35);
          mobileSalaryView = list.scrollLeft >= threshold ? 'revenue' : 'salary';
        }, 80);
      });
    }
  }

  function openSalaryDetail(staffId, ordersOverride){
    var sourceOrders = Array.isArray(ordersOverride) ? ordersOverride : state.orders;
    var map = aggregateCommissionsByStaff(sourceOrders);
    var rec = map[staffId];
    if(!rec) return;

    var details = salaryBreakdownForStaff(staffId, sourceOrders);
    var grouped = [];
    var groupMap = {};

    details.forEach(function(d){
      var key = d.order.id || ('num:' + (d.order.orderNumber||''));
      if(!groupMap[key]){
        groupMap[key] = { order:d.order, amount:0, works:[] };
        grouped.push(groupMap[key]);
      }
      groupMap[key].amount += d.amount;
      groupMap[key].works.push(d);
    });

    var rows = grouped.map(function(g){
      var o = g.order;
      var carLabel = [o.carMake, o.carModel].filter(Boolean).join(' ') || '—';
      var issuedLabel = o.dateOut ? new Date(o.dateOut + 'T00:00:00').toLocaleDateString('ru-RU') : 'дата не указана';
      var worksHtml = g.works.map(function(d){
        var l = d.line;
        var workName = l.name || 'Работа без названия';
        var basis = d.assigneesCount > 1
          ? ('Сумма работы ' + fmtMoney(d.workTotal) + ' · исполнителей ' + d.assigneesCount + ' · ставка ' + d.pct + '%')
          : ('Сумма работы ' + fmtMoney(d.workTotal) + ' · ставка ' + d.pct + '%');
        return '<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0 9px 12px;border-top:1px solid rgba(127,127,127,.14);">' +
          '<div style="min-width:0;">' +
            '<div style="font-size:13px;font-weight:600;overflow-wrap:anywhere;">' + escapeHtml(workName) + '</div>' +
            '<div style="font-size:11px;color:var(--text-subtle);margin-top:3px;">' + escapeHtml(basis) + '</div>' +
          '</div>' +
          '<div style="font-family:\'JetBrains Mono\',monospace;font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;">+' + fmtMoney(d.amount) + '</div>' +
        '</div>';
      }).join('');

      return '<div style="border:1px solid var(--border);border-radius:11px;background:var(--bg-panel-2);padding:11px 12px;margin-bottom:10px;">' +
        '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">' +
          '<div style="min-width:0;">' +
            '<div style="font-size:14px;font-weight:700;">ЗН № ' + escapeHtml(o.orderNumber||'—') + '</div>' +
            '<div style="font-size:11.5px;color:var(--text-muted);margin-top:3px;">' + escapeHtml(issuedLabel) + ' · ' + escapeHtml(o.clientName||'—') + ' · ' + escapeHtml(carLabel) + '</div>' +
          '</div>' +
          '<div style="font-family:\'JetBrains Mono\',monospace;font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap;">' + fmtMoney(g.amount) + '</div>' +
        '</div>' +
        '<div style="margin-top:8px;">' + worksHtml + '</div>' +
      '</div>';
    }).join('');

    if(!rows) rows = '<div style="color:var(--text-muted);text-align:center;padding:24px;">Нет выданных нарядов с начислениями</div>';

    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-overlay" id="salaryDetailOverlay">' +
        '<div class="modal" style="max-width:620px;">' +
          '<div class="modal-head">' +
            '<h2>' + escapeHtml(rec.name) + ' · зарплата</h2>' +

              'padding:10px 0 16px;border-bottom:1px solid var(--border);margin-bottom:14px;">' +
              '<div><div style="color:var(--text-muted);font-size:13px;">Итого по выданным ЗН</div>' +

              '<div style="font-family:\'JetBrains Mono\',monospace;font-size:22px;font-weight:700;color:var(--accent);">' +
                fmtMoney(rec.amount) +

  function pad2(n){ return String(n).padStart(2,'0'); }

  function renderDashboard(){
    if(!state.loaded) return;
    var now = new Date();
    var todayStr = now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
    var monthStr = now.getFullYear()+'-'+pad2(now.getMonth()+1);

    var todayDone = state.orders.filter(function(o){ return o.status==='done' && (o.dateOut||'').startsWith(todayStr); });
    var monthDone = state.orders.filter(function(o){ return o.status==='done' && (o.dateOut||'').startsWith(monthStr); });

    var todayRev = todayDone.reduce(function(s,o){ return s+calcOrderTotal(o); },0);
    var monthRev = monthDone.reduce(function(s,o){ return s+calcOrderTotal(o); },0);

    var el = function(id){ return document.getElementById(id); };
    if(el('dTodayRev'))  el('dTodayRev').textContent  = fmtMoney(todayRev);
    if(el('dTodayDone')) el('dTodayDone').textContent = todayDone.length;
    if(el('dMonthRev'))  el('dMonthRev').textContent  = fmtMoney(monthRev);
    if(el('dMonthDone')) el('dMonthDone').textContent = monthDone.length;

    // Status breakdown (open only)
    var statusRow = el('dStatusRow');
    if(statusRow){
      var counts = {};
      state.orders.forEach(function(o){ if(o.status!=='done') counts[o.status]=(counts[o.status]||0)+1; });
      var dotColors = { new:'#3B82F6', progress:'#F59E0B', ready:'#22C55E' };
      var labels    = { new:'Новые', progress:'В работе', ready:'Готово' };
      var rows = Object.keys(labels).map(function(k){
        return '<div class="status-pill-item">' +
          '<span><span class="status-dot" style="background:' + (dotColors[k]||'#9CA3AF') + '"></span>' + labels[k] + '</span>' +
          '<b>' + (counts[k]||0) + '</b>' +
        '</div>';
      }).join('');
      statusRow.innerHTML = rows;
    }
  }

  // ===== Export CSV =====
  function downloadCSV(content, filename){
    var bom = '\uFEFF';
    var blob = new Blob([bom + content], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function exportOrdersCSV(){
    var cols = ['Номер','Дата создания','Клиент','Телефон','Авто','Гос номер','Статус','Мастер','Итого'];
    var rows = [cols.join(';')];
    state.orders.forEach(function(o){
      var car = [o.carMake, o.carModel, o.carYear].filter(Boolean).join(' ');

    async function changeStatus(id, newStatus){
    var order = state.orders.find(function(o){ return o.id === id; });
    if(!order || order.status === newStatus) return false;
    var prev = order.status;

    if(prev === 'done' && newStatus !== 'done'){
      var pinApproved = await requestIssuedStatusPassword();
      if(!pinApproved) return false;
      if(order.status !== prev) return false;
    }

    order.status = newStatus;
    if(newStatus === 'done'){
      if(!order.dateOut) order.dateOut = todayStr();
      if(!order.issuedAt) order.issuedAt = Date.now();
    }
    render();
    var ok = await saveOrder(order);
    if(ok){
      showToast('Статус изменён: ' + STATUS_LABEL[newStatus]);
      return true;
    } else {
      order.status = prev;
      render();
      return false;
    }
  }

  function pluralRu(n, one, few, many){
    n = Math.abs(Number(n)||0) % 100;
    if(n >= 11 && n <= 14) return many;
    n = n % 10;
    if(n === 1) return one;
    if(n >= 2 && n <= 4) return few;
    return many;
  }

  function integerToWordsRu(value){
    var n = Math.floor(Math.abs(Number(value)||0));
    if(n === 0) return 'ноль';

    var onesMale = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
    var onesFemale = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
    var teens = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
    var tens = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
    var hundreds = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
    var scales = [
      null,
      ['тысяча', 'тысячи', 'тысяч', true],
      ['миллион', 'миллиона', 'миллионов', false],
      ['миллиард', 'миллиарда', 'миллиардов', false],
      ['триллион', 'триллиона', 'триллионов', false]
    ];

    var groups = [];
    while(n > 0){
      groups.push(n % 1000);
      n = Math.floor(n / 1000);
    }

    var result = [];
    for(var i = groups.length - 1; i >= 0; i--){
      var g = groups[i];
      if(!g) continue;
      var words = [];
      var hnd = Math.floor(g / 100);
      var rest = g % 100;
      if(hnd) words.push(hundreds[hnd]);
      if(rest >= 10 && rest <= 19){
        words.push(teens[rest - 10]);
      }else{
        var ten = Math.floor(rest / 10);
        var one = rest % 10;
        if(ten) words.push(tens[ten]);
        if(one){
          var female = i === 1;
          words.push((female ? onesFemale : onesMale)[one]);
        }
      }
      if(i > 0 && scales[i]){
        words.push(pluralRu(g, scales[i][0], scales[i][1], scales[i][2]));
      }
      result = result.concat(words);
    }
    return result.join(' ');
  }

  function moneyToWordsRu(value){
    var num = Number(value) || 0;
    var negative = num < 0;
    var totalKopecks = Math.round(Math.abs(num) * 100);
    var rubles = Math.floor(totalKopecks / 100);
    var kopecks = totalKopecks % 100;
    var words = integerToWordsRu(rubles) + ' ' + pluralRu(rubles, 'рубль', 'рубля', 'рублей') +
      ' ' + String(kopecks).padStart(2, '0') + ' ' + pluralRu(kopecks, 'копейка', 'копейки', 'копеек');
    if(negative) words = 'минус ' + words;
    return words.charAt(0).toUpperCase() + words.slice(1);
  }

  function openPrintWindow(title, bodyHtml, css, fitOnePage){
    if(fitOnePage){
      // A4 printable area: 190 x 277 mm with 10 mm page margins.
      css += 'body{width:190mm;margin:0 auto;padding:0;box-sizing:border-box;}' +
        '.print-doc{display:flow-root;}' +
        '@media print{@page{size:A4;margin:10mm;}body{width:190mm;margin:0;padding:0;}}';
    }
    var docHtml = '<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>' + title + '</title>' +
      '<style>' + css + '</style></head><body>' + bodyHtml + '</body></html>';
    var w = window.open('', '_blank', 'width=900,height=1000');
    if(!w){ showToast('Браузер заблокировал окно печати. Разрешите всплывающие окна.'); return; }
    w.document.open(); w.document.write(docHtml); w.document.close(); w.focus();
    var printStarted = false;
    function tryPrint(){
      if(printStarted || w.closed) return;
      printStarted = true;
      try{
        if(fitOnePage){
          var page = w.document.querySelector('.print-doc');
          if(page){
            // Measure at A4 print width; reduce the entire layout (including fonts)
            // only if the document exceeds the safe one-page height.
            var measure = w.document.createElement('div');
            measure.style.cssText = 'position:absolute;visibility:hidden;height:270mm;width:1px;pointer-events:none;';
            w.document.body.appendChild(measure);
            var maxHeight = measure.getBoundingClientRect().height;
            measure.remove();
            var scale = 1;
            page.style.zoom = '1';
            for(var i=0; i<75 && page.getBoundingClientRect().height > maxHeight; i++){
              scale = Math.max(0.25, scale * 0.94);
              page.style.zoom = String(scale);
              if(scale <= 0.25) break;
            }
          }
        }
        w.focus();
        w.print();
      }catch(e){ console.error('Ошибка печати', e); }
    }
    if(w.document.readyState === 'complete'){ setTimeout(tryPrint, fitOnePage ? 250 : 150); }
    else { w.onload = function(){ setTimeout(tryPrint, fitOnePage ? 250 : 150); }; setTimeout(tryPrint, 800); }
  }

  function nextOrderNumber(){
    var year = new Date().getFullYear();
    var maxN = 0;
    state.orders.forEach(function(o){
      var m = (o.orderNumber||'').match(/^(\d+)/);
      if(m){ maxN = Math.max(maxN, parseInt(m[1],10)); }
    });
    return String(maxN + 1).padStart(4,'0') + '-' + year;
  }

  function openQuickOrderForm(editId){
    var existingOrder = editId ? state.orders.find(function(o){ return o.id === editId; }) : null;
    if(editId && !existingOrder){
      showToast('Наряд не найден');
      return;
    }
    if(existingOrder && existingOrder.status === 'done'){
      showToast('Нельзя редактировать выданный наряд. Сначала измените статус.');
      return;
    }

    function editableQuickLine(source){
      var line = JSON.parse(JSON.stringify(source || {}));
      line._key = line._key || lineId();
      line.type = line.type === 'part' ? 'part' : 'work';
      line.qty = Number(line.qty) || 1;
      line.stockItemId = line.type === 'part' ? (line.stockItemId || null) : null;
      line.assignees = line.type === 'work' ? (line.assignees || []).filter(Boolean) : [];

      line.price = roundPriceToTenth(line.price);
      if(line.type === 'part'){
        var stockItem = line.stockItemId ? getStockItemById(line.stockItemId) : null;
        if(line.costPrice !== undefined && line.costPrice !== null && line.costPrice !== ''){
          line.costPrice = roundPriceToTenth(line.costPrice);
        }else if(line.quickCostPrice !== undefined && line.quickCostPrice !== null && line.quickCostPrice !== ''){
          line.costPrice = roundPriceToTenth(line.quickCostPrice);
        }else if(stockItem){
          line.costPrice = roundPriceToTenth(stockItem.costPrice);
        }else if(line.price > 0){
          line.costPrice = line.price / (1 + ORDER_MANUAL_PART_MARKUP_PCT / 100);
        }else{
          line.costPrice = 0;
        }
        if(!line.price && line.costPrice && !line.stockItemId){
          line.price = manualPartSellPrice(line.costPrice);
        }
      }
      return line;
    }

    var qOrder = {
      clientId: existingOrder ? (existingOrder.clientId || null) : null,
      lines: existingOrder ? (existingOrder.lines || []).map(editableQuickLine) : []
    };

    function quickLineSellPrice(line){
      return Number(line && line.price) || 0;
    }

                '<button type="button" id="qAddWork" style="width:100%;padding:9px;border-radius:9px;border:1.5px dashed var(--border);background:transparent;color:var(--text-subtle);cursor:pointer;font-size:13px;font-family:inherit;">+ Добавить работу</button>' +
              '</div>' +
              '<div class="q-section-total"><span class="q-section-total-label">Итого работы</span><span class="q-section-total-value" id="qWorkTotal">0&nbsp;₽</span></div>' +
            '</div>' +
            '<div class="q-section">' +
              '<label style="' + fl + '">🔩 Запчасти</label>' +
              '<div style="font-size:10px;color:var(--text-subtle);margin:-2px 0 6px;">Закупка → автонаценка +45%. Поле «После наценки» можно изменить вручную. Для склада подставится текущая цена продажи.</div>' +
              '<div id="qPartLines" style="display:flex;flex-direction:column;gap:6px;"></div>' +
              '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;margin-top:8px;">' +
                '<button type="button" id="qPastePart" style="width:100%;padding:9px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-panel-2);color:var(--text-subtle);cursor:pointer;font-size:12px;font-family:inherit;">📋 Из буфера</button>' +
                '<button type="button" id="qAddPart" style="width:100%;padding:9px;border-radius:9px;border:1.5px dashed var(--border);background:transparent;color:var(--text-subtle);cursor:pointer;font-size:13px;font-family:inherit;">+ Добавить запчасть</button>' +
              '</div>' +
              '<div class="q-section-total"><span class="q-section-total-label">Итого запчасти</span><span class="q-section-total-value" id="qPartTotal">0&nbsp;₽</span></div>' +
