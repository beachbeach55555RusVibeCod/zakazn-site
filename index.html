          '</div>' +

        '</div>' +

        /* Подвал */
        '<div class="q-footer" style="padding:12px 18px 24px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:10px;">' +
          '<div style="flex:1;">' +
            '<div style="font-size:11px;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.05em;">Итого</div>' +
            '<div id="qTotal" style="font-size:20px;font-weight:700;font-family:\'JetBrains Mono\',monospace;">0&nbsp;₽</div>' +
          '</div>' +
          '<button id="qFullForm" style="padding:10px 16px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-family:inherit;font-size:13px;">Полная форма</button>' +
          '<button id="qSave" style="padding:11px 24px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;">' + (existingOrder ? 'Сохранить изменения' : 'Сохранить') + '</button>' +
        '</div>' +

      '</div>';

    document.body.appendChild(overlay);

    /* Номер наряда */
    var orderNum = existingOrder ? existingOrder.orderNumber : nextOrderNumber();
    var orderDateLabel = existingOrder && existingOrder.dateIn
      ? fmtDate(existingOrder.dateIn)
      : new Date().toLocaleDateString('ru-RU');
    document.getElementById('qOrderNum').textContent = '№ ' + orderNum + ' · ' + orderDateLabel;
    document.getElementById('qCarMake').value = existingOrder ? (existingOrder.carMake || '') : '';

    /* Добавление строк */
    function addLine(type){
      var key = lineId();
      var line = { _key: key, type: type, name: '', qty: 1, price: 0, costPrice: 0, stockItemId: null, assignees: [] };
      qOrder.lines.push(line);
      renderQLines();
    }

    function insertQuickPartName(text){
      var name = normalizeClipboardPartName(text);
      if(!name){ showToast('Буфер обмена пуст'); return; }

      var line = qOrder.lines.find(function(l){
        return l.type === 'part' && !String(l.name||'').trim();
      });
      if(!line){
        line = { _key: lineId(), type:'part', name:'', qty:1, price:0, costPrice:0, stockItemId:null, assignees:[] };
        qOrder.lines.push(line);
      }

      line.name = name;
      var stockMatch = findStockItemByName(name);
      line.stockItemId = stockMatch ? stockMatch.id : null;
      if(stockMatch){
        line.costPrice = roundPriceToTenth(stockMatch.costPrice);
        line.price = stockSellPrice(stockMatch);
      }

      renderQLines();
      updateQTotal();

      var inputs = document.querySelectorAll('#qPartLines .q-name');
      Array.prototype.some.call(inputs, function(inp){
        if(inp.dataset.key === line._key){
          inp.focus();
          inp.setSelectionRange(inp.value.length, inp.value.length);
          return true;
        }
        return false;
      });
      showToast(stockMatch ? 'Запчасть вставлена и найдена на складе' : 'Название запчасти вставлено');
    }

    function applyQuickPresetTO(){
      var preset = [
        { name:'Замена масла в ДВС', price:1000 },
        { name:'Замена воздушного фильтра', price:550 },
        { name:'Замена салонного фильтра', price:550 }
      ];

      // Убираем только полностью пустые строки работ, чтобы пресет не оставлял лишний пустой пункт.
      qOrder.lines = qOrder.lines.filter(function(l){
        if(l.type !== 'work') return true;
        return String(l.name||'').trim() || Number(l.price) > 0;
      });

      var existingNames = {};
      qOrder.lines.forEach(function(l){
        if(l.type === 'work' && l.name){
          existingNames[String(l.name).trim().toLowerCase()] = true;
        }
      });

      preset.forEach(function(p){
        var key = p.name.toLowerCase();
        if(existingNames[key]) return;
        qOrder.lines.push({
          _key: lineId(),
          type:'work',
          name:p.name,
          qty:1,
          price:p.price,
          stockItemId:null,
          assignees:[]
        });
        existingNames[key] = true;
      });

      renderQLines();
      updateQTotal();
    }

    function renderLineGroup(wrapId, type){
      var wrap = document.getElementById(wrapId);
      if(!wrap) return;
      wrap.innerHTML = '';
      qOrder.lines.filter(function(l){ return l.type === type; }).forEach(function(line){
        var row = document.createElement('div');
        row.className = 'q-line-row' + (type === 'part' ? ' q-part-line' : '');
        row.style.cssText = 'display:grid;gap:7px;align-items:center;';
        var quickStockListId = 'qStockList_' + line._key;
        var quickStockOptions = type === 'part' ? state.stockItems.map(function(s){
          return '<option value="' + escapeHtml(s.name) + '"' + (s.sku ? ' label="арт. ' + escapeHtml(s.sku) + '"' : '') + '></option>';
        }).join('') : '';
        var quickStaffOptions = type === 'work' ? state.staff.map(function(s){
          return '<option value="' + escapeHtml(s.id) + '"' + ((line.assignees||[])[0] === s.id ? ' selected' : '') + '>' + escapeHtml(s.name) + '</option>';
        }).join('') : '';
        var quickPriceFields = type === 'part'
          ? '<input class="q-cost" data-key="' + line._key + '" data-f="costPrice" type="number" min="0" step="0.1" value="' + (line.costPrice ? priceInputValue(line.costPrice) : '') + '" placeholder="Закупка" title="' + (line.stockItemId ? 'Закупочная цена со склада' : 'Закупочная цена; после изменения цена продажи пересчитается с +45%') + '"' + (line.stockItemId ? ' readonly' : '') + ' style="' + fi + 'padding:8px 6px;">' +
            '<input class="q-price" data-key="' + line._key + '" data-f="price" type="number" min="0" step="0.1" value="' + (line.price ? priceInputValue(line.price) : '') + '" placeholder="После наценки" title="Цена продажи после наценки — можно изменить вручную" style="' + fi + 'padding:8px 6px;">'
          : '<input class="q-price" data-key="' + line._key + '" data-f="price" type="number" min="0" step="0.01" value="' + (line.price||'') + '" placeholder="Цена" title="Цена" style="' + fi + 'padding:8px 6px;">';
        row.innerHTML =
          '<input class="q-name" data-key="' + line._key + '" data-f="name" value="' + escapeHtml(line.name) + '" placeholder="' + (type === 'work' ? 'Работа' : 'Запчасть') + '"' + (type === 'part' ? ' list="' + quickStockListId + '"' : '') + ' autocomplete="off" style="' + fi + 'padding:8px 10px;">' +
          (type === 'part' ? '<datalist id="' + quickStockListId + '">' + quickStockOptions + '</datalist>' : '') +
          '<input class="q-qty" data-key="' + line._key + '" data-f="qty" type="number" min="1" value="' + line.qty + '" placeholder="Кол" style="' + fi + 'padding:8px 6px;text-align:center;">' +
          quickPriceFields +
          '<button class="q-remove" data-key="' + line._key + '" data-f="remove" style="background:none;border:none;color:var(--text-subtle);cursor:pointer;font-size:18px;padding:0 4px;line-height:1;">×</button>' +
          (type === 'work' ? '<select class="q-assignee" data-key="' + line._key + '" style="' + fi + 'padding:8px 8px;"><option value="">Исполнитель</option>' + quickStaffOptions + '</select>' : '');
        wrap.appendChild(row);
      });

      wrap.querySelectorAll('input').forEach(function(el){
        el.addEventListener('input', function(){
          var k = el.dataset.key, f = el.dataset.f;
          var line = qOrder.lines.find(function(l){ return l._key === k; });
          var currentRow = el.closest('.q-line-row');
          if(!line || !currentRow) return;
          if(f === 'name'){
            line.name = el.value;
            if(line.type === 'part'){
              var previousStockItemId = line.stockItemId;
              var stockMatch = findStockItemByName(el.value);
              line.stockItemId = stockMatch ? stockMatch.id : null;
              var costInput = currentRow.querySelector('.q-cost');
              var priceInput = currentRow.querySelector('.q-price');
              if(stockMatch){
                line.costPrice = Number(stockMatch.costPrice) || 0;
                line.price = stockSellPrice(stockMatch);
                if(costInput){
                  costInput.value = line.costPrice ? priceInputValue(line.costPrice) : '';
                  costInput.readOnly = true;
                  costInput.title = 'Закупочная цена со склада';
                }
                if(priceInput){
                  priceInput.value = priceInputValue(line.price);
                  priceInput.placeholder = 'После наценки';
                  priceInput.title = 'Цена продажи после складской наценки — можно изменить вручную';
                }
              }else if(previousStockItemId){
                line.costPrice = 0;
                line.price = 0;
                if(costInput){
                  costInput.value = '';
                  costInput.readOnly = false;
                  costInput.title = 'Закупочная цена; после изменения цена продажи пересчитается с +45%';
                }
                if(priceInput){
                  priceInput.value = '';
                  priceInput.placeholder = 'После наценки';
                  priceInput.title = 'Цена продажи после наценки — можно изменить вручную';
                }
              }
            }
          }
          if(f === 'qty') line.qty = Number(el.value)||1;
          if(f === 'costPrice'){
            line.costPrice = Number(el.value)||0;
            if(line.type === 'part' && !line.stockItemId){
              line.price = manualPartSellPrice(line.costPrice);
              var sellInput = currentRow.querySelector('.q-price');
              if(sellInput) sellInput.value = line.price ? priceInputValue(line.price) : '';
            }
          }
          if(f === 'price') line.price = Number(el.value)||0;
          updateQTotal();
        });
        el.addEventListener('focus', function(){ el.style.borderColor='var(--accent)'; });
        el.addEventListener('blur', function(){
          el.style.borderColor='var(--border)';
          var field = el.dataset.f;
          var line = qOrder.lines.find(function(l){ return l._key === el.dataset.key; });
          var currentRow = el.closest('.q-line-row');
          if(!line || !currentRow || line.type !== 'part' || (field !== 'costPrice' && field !== 'price')) return;
          line[field] = roundPriceToTenth(el.value);
          if(field === 'costPrice' && !line.stockItemId){
            line.price = manualPartSellPrice(line.costPrice);
            var sellInput = currentRow.querySelector('.q-price');
            if(sellInput) sellInput.value = line.price ? priceInputValue(line.price) : '';
          }
          el.value = line[field] ? priceInputValue(line[field]) : '';
          updateQTotal();
        });
      });
      wrap.querySelectorAll('.q-assignee').forEach(function(sel){
        sel.addEventListener('change', function(){
          var line = qOrder.lines.find(function(l){ return l._key === sel.dataset.key; });
          if(!line) return;
          line.assignees = sel.value ? [sel.value] : [];
        });
      });
      wrap.querySelectorAll('[data-f="remove"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          qOrder.lines = qOrder.lines.filter(function(l){ return l._key !== btn.dataset.key; });
          renderQLines();
          updateQTotal();
        });
      });
    }

    function renderQLines(){
      renderLineGroup('qWorkLines', 'work');
      renderLineGroup('qPartLines', 'part');
    }

    function updateQTotal(){
      var workSum = 0;
      var partSum = 0;
      qOrder.lines.forEach(function(l){
        var lineSum = (Number(l.qty)||1) * quickLineSellPrice(l);
        if(l.type === 'part') partSum += lineSum;
        else workSum += lineSum;
      });
      var workEl = document.getElementById('qWorkTotal');
      var partEl = document.getElementById('qPartTotal');
      var totalEl = document.getElementById('qTotal');
      if(workEl) workEl.textContent = fmtMoney(workSum);
      if(partEl) partEl.textContent = fmtMoney(partSum);
      if(totalEl) totalEl.textContent = fmtMoney(workSum + partSum);
    }

    document.getElementById('qPresetTO').addEventListener('click', applyQuickPresetTO);
    document.getElementById('qAddWork').addEventListener('click', function(){ addLine('work'); });
    document.getElementById('qAddPart').addEventListener('click', function(){ addLine('part'); });
    document.getElementById('qPastePart').addEventListener('click', async function(){
      try{
        var text = await readClipboardPartName();
        insertQuickPartName(text);
      }catch(e){
        showToast('Не удалось прочитать буфер. Разрешите вставку или используйте обычное «Вставить»');
      }
    });
    overlay.addEventListener('paste', function(e){
      var target = e.target;
      var editable = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable);
      if(editable) return;
      var text = e.clipboardData ? e.clipboardData.getData('text') : '';
      if(!text) return;
      e.preventDefault();
      insertQuickPartName(text);
    });
    document.getElementById('qClose').addEventListener('click', function(){ overlay.remove(); });
    // Клик по затемнённой области не закрывает быстрый ЗН:
    // пользователь не потеряет введённые данные случайным нажатием вне формы.

    /* Открыть полную форму */
    document.getElementById('qFullForm').addEventListener('click', function(){
      overlay.remove();
      openOrderForm(existingOrder ? existingOrder.id : null);
    });

    /* Сохранить */
    document.getElementById('qSave').addEventListener('click', async function(){
      var latestQuickOrder = existingOrder ? state.orders.find(function(o){ return o.id === existingOrder.id; }) : null;
      if(existingOrder && (existingOrder.status === 'done' || (latestQuickOrder && latestQuickOrder.status === 'done'))){
        showToast('Нельзя редактировать выданный наряд. Сначала измените статус.');
        overlay.remove();
        return;
      }
      var btn = document.getElementById('qSave');
      btn.disabled = true; btn.textContent = 'Сохранение…';

      var order = existingOrder
        ? JSON.parse(JSON.stringify(existingOrder))
        : {
            id: uid(),
            orderNumber: orderNum,
            status: 'new',
            dateIn: new Date().toISOString().slice(0,10),
            dateOut: '',
            clientId: qOrder.clientId,
            clientName: '',
            clientPhone: '',
            carMake: '',
            carModel: '',
            plate: '',
            vin: '',
            mileage: '',
            master: '',
            note: '',
            lines: [],
            signature: null,
            createdAt: Date.now(),
            issuedAt: null
          };

      order.editorMode = 'quick';
      order.orderNumber = orderNum;
      order.clientId = qOrder.clientId;
      order.carMake = (document.getElementById('qCarMake').value || '').trim();
      order.lines = qOrder.lines.filter(function(l){
        return (l.name && l.name.trim()) || Number(l.price) > 0;
      }).map(function(l){
        var manualQuickPart = l.type === 'part' && !l.stockItemId;
        return {
          name:l.name || '',
          qty:Number(l.qty)||1,
          price:quickLineSellPrice(l),
          type:l.type,
          assignees:l.type === 'work' ? (l.assignees||[]).filter(Boolean) : [],
          stockItemId:l.type === 'part' ? (l.stockItemId || null) : null,
          costPrice:l.type === 'part' ? (Number(l.costPrice)||0) : null,
          quickCostPrice:manualQuickPart ? (Number(l.costPrice)||0) : null
        };
      });

      var stockCheck = checkStockAvailability(existingOrder, order.lines);
      if(!stockCheck.ok){
        var itemName = stockCheck.item ? stockCheck.item.name : 'запчасть';
        showToast('Недостаточно на складе «' + itemName + '»: нужно ' + stockCheck.needed + ', есть ' + stockCheck.available);
        btn.disabled = false;
        btn.textContent = existingOrder ? 'Сохранить изменения' : 'Сохранить';
        return;
      }

      var linkResult = await upsertClientAndVehicle(order);
      order.clientId  = linkResult.clientId;
      order.vehicleId = linkResult.vehicleId;

      var ok = await saveOrder(order);
      if(ok){
        await applyStockDiff(existingOrder, order.lines);
        var existingIdx = state.orders.findIndex(function(o){ return o.id === order.id; });
        if(existingIdx === -1) state.orders.unshift(order);
        else state.orders[existingIdx] = order;
        render();
        overlay.remove();
        showToast(existingOrder ? ('Наряд № ' + orderNum + ' обновлён') : ('Наряд № ' + orderNum + ' создан'));
      } else {
        btn.disabled = false;
        btn.textContent = existingOrder ? 'Сохранить изменения' : 'Сохранить';
      }
    });

    /* Для нового наряда — одна пустая работа. При редактировании показываем сохранённые строки. */
    if(qOrder.lines.length){
      renderQLines();
      updateQTotal();
    }else{
      addLine('work');
    }
  }

  function openOrderForm(editId){
    var order;
    if(editId){
      var existing = state.orders.find(function(o){ return o.id === editId; });
      if(!existing){
        showToast('Наряд не найден');
        return;
      }
      if(existing.status === 'done'){
        showToast('Нельзя редактировать выданный наряд. Сначала измените статус.');
        return;
      }
      order = JSON.parse(JSON.stringify(existing));
    } else {
      order = emptyOrder();
    }
    order.lines = (order.lines||[]).map(function(l){
      l._key = l._key || lineId();
      if(!l.type) l.type = 'work';
      if(!l.assignees) l.assignees = [];
      l.price = roundPriceToTenth(l.price);
      if(l.type === 'part'){
        var stockItem = l.stockItemId ? getStockItemById(l.stockItemId) : null;
        if(l.costPrice !== undefined && l.costPrice !== null && l.costPrice !== ''){
          l.costPrice = roundPriceToTenth(l.costPrice);
        }else if(l.quickCostPrice !== undefined && l.quickCostPrice !== null && l.quickCostPrice !== ''){
          l.costPrice = roundPriceToTenth(l.quickCostPrice);
        }else if(stockItem){
          l.costPrice = roundPriceToTenth(stockItem.costPrice);
        }else{
          l.costPrice = 0;
        }
        if(!l.price && l.costPrice && !l.stockItemId){
          l.price = manualPartSellPrice(l.costPrice);
        }
      }
      return l;
    });
    if(order.lines.length === 0){

          '</div>' +

            '<div class="of-nav" id="ofNav">' +
              '<div class="of-nav-item" data-target="of-sec-client"><span class="of-num">1</span>Клиент</div>' +
              '<div class="of-nav-item" data-target="of-sec-car"><span class="of-num">2</span>Автомобиль</div>' +
              '<div class="of-nav-item" data-target="of-sec-reception"><span class="of-num">3</span>Приёмка</div>' +
              '<div class="of-nav-item" data-target="of-sec-lines"><span class="of-num">4</span>Работы и запчасти</div>' +
              '<div class="of-nav-item" data-target="of-sec-sig"><span class="of-num">5</span>Подпись</div>' +
            '</div>' +
            '<div class="of-scroll" id="ofScroll">' +

            '<div class="form-section of-sec" id="of-sec-client">' +
              '<div class="form-section-title" style="display:flex;justify-content:space-between;align-items:center;">Клиент<button type="button" class="btn btn-ghost btn-sm" id="btnPickClient" style="font-size:12px;">👤 Выбрать из базы</button></div>' +
              '<div id="selectedClientBadge" style="display:none;"></div>' +

                '<div class="field required"><label>ФИО клиента</label><input id="f_clientName" type="text" placeholder="Иванов Иван Иванович" value="' + escapeHtml(order.clientName) + '"></div>' +

      if(!scrollArea || !navItems.length) return;

      function updateActiveNav(){
        var top = scrollArea.getBoundingClientRect().top;
        var current = sections[0];
        sections.forEach(function(sec){
          if(sec.getBoundingClientRect().top - top <= 90) current = sec;
        });
        navItems.forEach(function(item){
          item.classList.toggle('active', !!current && item.dataset.target === current.id);
        });
      }
      navItems.forEach(function(item){
        item.addEventListener('click', function(){
          var target = document.getElementById(item.dataset.target);
          if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
        });
      });
      scrollArea.addEventListener('scroll', updateActiveNav);
      updateActiveNav();
    })();

    function insertFullPartName(text){
      var name = normalizeClipboardPartName(text);
      if(!name){ showToast('Буфер обмена пуст'); return; }

      var line = order.lines.find(function(l){
        return l.type === 'part' && !String(l.name||'').trim();
      });
      if(!line){
        line = { name:'', qty:1, price:0, costPrice:0, type:'part', stockItemId:null, _key:lineId() };
        order.lines.push(line);
      }

      line.name = name;
      var stockMatch = findStockItemByName(name);
      line.stockItemId = stockMatch ? stockMatch.id : null;
      if(stockMatch){
        line.costPrice = roundPriceToTenth(stockMatch.costPrice);
        line.price = stockSellPrice(stockMatch);
      }

      renderAllLines();

      var partLines = order.lines.filter(function(l){ return l.type === 'part'; });
      var index = partLines.indexOf(line);
      var inputs = document.querySelectorAll('#partLinesWrap input[data-field="name"]');
      if(index >= 0 && inputs[index]){
        inputs[index].focus();
        inputs[index].setSelectionRange(inputs[index].value.length, inputs[index].value.length);
      }
      showToast(stockMatch ? 'Запчасть вставлена и найдена на складе' : 'Название запчасти вставлено');
    }

            '<input type="number" min="0" step="0.01" value="' + (line.price||0) + '" data-field="price">' +

          '</div>' +
          '<div class="line-assignees">' +
            '<select class="assignee-select" data-assignee-idx="0"><option value="">Исполнитель 1</option>' + staffOptions + '</select>' +
            '<select class="assignee-select" data-assignee-idx="1"><option value="">Исполнитель 2</option>' + staffOptions + '</select>' +
            '<span class="line-commission-hint" data-commission-hint></span>' +
          '</div>';

        block.querySelectorAll('.line-row input').forEach(function(inp){
          inp.addEventListener('input', function(){
            line[inp.dataset.field] = inp.dataset.field === 'name' ? inp.value : Number(inp.value);
            if(inp.dataset.field === 'name'){
              var workMatch = findPriceItemByName(inp.value);
              if(workMatch){
                line.price = workMatch.price;
                var priceInput = block.querySelector('.line-row input[data-field="price"]');
                if(priceInput){ priceInput.value = workMatch.price; }
              }
            }
            block.querySelector('.line-sum').textContent = fmtMoney(lineTotal(line));
            updateCommissionHint();
            updateFormTotal(order.lines);
          });
        });

        var selects = block.querySelectorAll('.assignee-select');
        selects.forEach(function(sel, idx){
          sel.value = line.assignees && line.assignees[idx] ? line.assignees[idx] : '';
          sel.addEventListener('change', function(){
            if(!line.assignees) line.assignees = [];
            line.assignees[idx] = sel.value || null;
            while(line.assignees.length && !line.assignees[line.assignees.length-1]){ line.assignees.pop(); }
            updateCommissionHint();
          });
        });

        function updateCommissionHint(){
          var hint = block.querySelector('[data-commission-hint]');
          if(!hint) return;
          var commissions = calcLineCommissions(line);
          if(commissions.length === 0){ hint.textContent = 'ЗП: исполнитель не выбран'; return; }
          hint.textContent = 'ЗП: ' + commissions.map(function(c){ return c.name + ' — ' + fmtMoney(c.amount) + ' (' + c.pct + '%)'; }).join(' · ');
        }
        updateCommissionHint();

        block.querySelector('.line-remove').addEventListener('click', function(){
          var idx = order.lines.indexOf(line);
          if(idx !== -1) order.lines.splice(idx,1);
          renderAllLines();
        });

        wrap.appendChild(block);
      });

      var workSum = workLines.reduce(function(s,l){ return s + lineTotal(l); }, 0);
      document.getElementById('workLinesTotal').textContent = fmtMoney(workSum);

        block.querySelectorAll('.line-row input').forEach(function(inp){
          inp.addEventListener('input', function(){
            line[inp.dataset.field] = inp.dataset.field === 'name' ? inp.value : Number(inp.value);
            if(inp.dataset.field === 'name'){
              var previousStockItemId = line.stockItemId;
              var stockMatch = findStockItemByName(inp.value);
              line.stockItemId = stockMatch ? stockMatch.id : null;
              var costInput2 = block.querySelector('.line-row input[data-field="costPrice"]');
              var priceInput2 = block.querySelector('.line-row input[data-field="price"]');
              if(stockMatch){
                line.costPrice = Number(stockMatch.costPrice) || 0;
                line.price = stockSellPrice(stockMatch);
                if(costInput2){
                  costInput2.value = priceInputValue(line.costPrice);
                  costInput2.readOnly = true;
                  costInput2.title = 'Закупочная цена со склада';
                }
                if(priceInput2){ priceInput2.value = priceInputValue(line.price); }
              }else if(previousStockItemId){
                line.costPrice = 0;
                line.price = 0;
                if(costInput2){
                  costInput2.value = '0';
                  costInput2.readOnly = false;
                  costInput2.title = 'Закупочная цена; после изменения цена продажи пересчитается с +45%';
                }
                if(priceInput2){ priceInput2.value = '0'; }
              }
              updateStockHint();
            }
            if(inp.dataset.field === 'costPrice' && !line.stockItemId){
              line.costPrice = Number(inp.value)||0;
              line.price = manualPartSellPrice(line.costPrice);
              var sellInput2 = block.querySelector('.line-row input[data-field="price"]');
              if(sellInput2) sellInput2.value = priceInputValue(line.price);

            if(inp.dataset.field === 'qty'){ updateStockHint(); }
            block.querySelector('.line-sum').textContent = fmtMoney(lineTotal(line));
            updateFormTotal(order.lines);
          });
          inp.addEventListener('blur', function(){
            var field = inp.dataset.field;
            if(field !== 'costPrice' && field !== 'price') return;
            line[field] = roundPriceToTenth(inp.value);
            if(field === 'costPrice' && !line.stockItemId){
              line.price = manualPartSellPrice(line.costPrice);
              var sellInput = block.querySelector('.line-row input[data-field="price"]');
              if(sellInput) sellInput.value = priceInputValue(line.price);
            }
            inp.value = priceInputValue(line[field]);
            block.querySelector('.line-sum').textContent = fmtMoney(lineTotal(line));
            updateFormTotal(order.lines);
          });
        });

        function updateStockHint(){
          var hint = block.querySelector('[data-stock-hint]');
          if(!hint) return;
          if(!line.stockItemId){ hint.textContent = 'Со склада: позиция не выбрана (списания не будет)'; hint.style.color = '#7C8290'; return; }
          var stockItem = getStockItemById(line.stockItemId);
          if(!stockItem){ hint.textContent = 'Позиция склада не найдена'; hint.style.color = '#7C8290'; return; }
          var needed = Number(line.qty)||0;
          var available = Number(stockItem.quantity)||0;
          if(available <= 0){
            hint.textContent = 'На складе нет в наличии (остаток 0)';
            hint.style.color = 'var(--danger)';
          } else if(needed > available){
            hint.textContent = 'Недостаточно на складе: нужно ' + needed + ', есть ' + available;
            hint.style.color = 'var(--danger)';
          } else {
            hint.textContent = 'На складе: ' + available + ' шт. (после сохранения останется ' + (available - needed) + ')';
            hint.style.color = '#7C8290';
          }
        }
        updateStockHint();

        block.querySelector('.line-remove').addEventListener('click', function(){
          var idx = order.lines.indexOf(line);
          if(idx !== -1) order.lines.splice(idx,1);
          renderAllLines();
        });

  function setupSignaturePad(existingDataUrl){
    var canvas = document.getElementById('sigCanvas');
    var ratio = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    var ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2B2925';
    state.sigCtx = ctx;
    state.sigHasContent = false;
    state.sigCanvas = canvas;

    if(existingDataUrl){
      var img = new Image();
      img.onload = function(){
        ctx.drawImage(img, 0, 0, rect.width, rect.height);
        state.sigHasContent = true;
      };
      img.src = existingDataUrl;
    }

    var drawing = false;
    var last = null;

    function pos(e){
      var r = canvas.getBoundingClientRect();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - r.left, y: clientY - r.top };
    }

    function start(e){
      e.preventDefault();
      drawing = true;
      last = pos(e);
    }
    function move(e){
      if(!drawing) return;
      e.preventDefault();
      var p = pos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
      state.sigHasContent = true;
    }
    function end(){ drawing = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive:false });
    canvas.addEventListener('touchmove', move, { passive:false });
    canvas.addEventListener('touchend', end);
  }

  function clearSignaturePad(){
    var canvas = state.sigCanvas;
    if(!canvas || !state.sigCtx) return;
    var rect = canvas.getBoundingClientRect();
    state.sigCtx.clearRect(0,0,rect.width,rect.height);
    state.sigHasContent = false;
  }

  function getSignatureDataUrl(){
    if(!state.sigCanvas || !state.sigHasContent) return '';
    try{
      return state.sigCanvas.toDataURL('image/png');
    }catch(e){ return ''; }
  }

  async function submitOrderForm(order){
    var savedOrder = state.orders.find(function(o){ return o.id === order.id; });
    if(savedOrder && savedOrder.status === 'done'){
      showToast('Нельзя редактировать выданный наряд. Сначала измените статус.');
      return;
    }
    order.editorMode = 'full';
    order.orderNumber = document.getElementById('f_orderNumber').value.trim();
    order.dateIn = document.getElementById('f_dateIn').value;
    order.dateOut = document.getElementById('f_dateOut').value;
    order.clientName = document.getElementById('f_clientName').value.trim();
    order.clientPhone = document.getElementById('f_clientPhone').value.trim();
    order.carMake = document.getElementById('f_carMake').value.trim();
    order.carModel = document.getElementById('f_carModel').value.trim();
    order.vin = document.getElementById('f_vin').value.trim().toUpperCase();
    order.plate = document.getElementById('f_plate').value.trim().toUpperCase();
    order.mileage = document.getElementById('f_mileage').value;
    order.master = document.getElementById('f_master').value.trim();
    order.note = document.getElementById('f_note').value.trim();

    var activeChip = document.querySelector('#formStatusRow .status-chip.active');
    var requestedStatus = activeChip ? activeChip.dataset.status : 'new';
    var existingStatusOrder = state.orders.find(function(o){ return o.id === order.id; });
    var previousStatus = existingStatusOrder ? existingStatusOrder.status : order.status;

    order.lines = (order.lines||[]).filter(function(l){ return (l.name && l.name.trim()) || (Number(l.qty)>0 && Number(l.price)>0); })
      .map(function(l){
        return {
          name: l.name||'',
          qty: Number(l.qty)||0,
          price: Number(l.price)||0,
          type: l.type === 'part' ? 'part' : 'work',
          assignees: l.type === 'work' ? (l.assignees||[]).filter(Boolean) : [],
          stockItemId: l.type === 'part' ? (l.stockItemId || null) : null,
          costPrice: l.type === 'part' ? (Number(l.costPrice)||0) : null,
          quickCostPrice: (l.type === 'part' && !l.stockItemId) ? (Number(l.costPrice)||0) : null
        };
      });

    var sig = getSignatureDataUrl();
    if(sig) order.signature = sig;

    if(!order.clientName){
      showToast('Укажите ФИО клиента');
      return;
    }
    if(!order.carMake){
      showToast('Укажите марку автомобиля');
      return;
    }
    if(!order.plate){
      showToast('Укажите гос. номер');
      return;
    }
    if(!order.orderNumber){
      showToast('Укажите номер наряда');
      return;
    }

    var existingOrderForStock = state.orders.find(function(o){ return o.id === order.id; }) || null;
    var stockCheck = checkStockAvailability(existingOrderForStock, order.lines);
    if(!stockCheck.ok){
      var itemName = stockCheck.item ? stockCheck.item.name : 'запчасть';
      showToast('Недостаточно на складе «' + itemName + '»: нужно ' + stockCheck.needed + ', есть ' + stockCheck.available);
      return;
    }

    if(previousStatus === 'done' && requestedStatus !== 'done'){
      var pinApproved = await requestIssuedStatusPassword();
      if(!pinApproved){
        document.querySelectorAll('#formStatusRow .status-chip').forEach(function(c){
          c.classList.toggle('active', c.dataset.status === previousStatus);
        });
        return;
      }
    }
    order.status = requestedStatus;

    var saveBtn = document.getElementById('formSave');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Сохранение…';

    var linkResult = await upsertClientAndVehicle(order);
    order.clientId = linkResult.clientId;
    order.vehicleId = linkResult.vehicleId;

    var ok = await saveOrder(order);
    saveBtn.disabled = false;
    saveBtn.textContent = 'Сохранить наряд';

    if(ok){
      await applyStockDiff(existingOrderForStock, order.lines);
      var idx = state.orders.findIndex(function(o){ return o.id === order.id; });
      if(idx === -1){ state.orders.unshift(order); }
      else { state.orders[idx] = order; }
      render();
      showToast(state.editingId ? 'Наряд обновлён' : 'Наряд создан');
      openDetail(order.id);
    }
  }

      if(!name){ formDiv.querySelector('#fNewClientName').focus(); return; }
      var type = formDiv.querySelector('#fNewClientType').value;
      var client = {
        id: clientUid(),
        name: name,
        phone: formDiv.querySelector('#fNewClientPhone').value.trim(),
        email: formDiv.querySelector('#fNewClientEmail').value.trim(),
        note:  formDiv.querySelector('#fNewClientNote').value.trim(),
        type:  type,
        createdAt: Date.now()
      };
      if(type === 'org'){
        client.orgName      = formDiv.querySelector('#fNewOrgName').value.trim();
        client.inn          = formDiv.querySelector('#fNewOrgInn').value.trim();
        client.kpp          = formDiv.querySelector('#fNewOrgKpp').value.trim();
        client.legalAddress = formDiv.querySelector('#fNewOrgAddr').value.trim();
        client.bank          = formDiv.querySelector('#fNewOrgBank').value.trim();
        client.bik           = formDiv.querySelector('#fNewOrgBik').value.trim();
        client.account       = formDiv.querySelector('#fNewOrgAccount').value.trim();
        client.corraccount   = formDiv.querySelector('#fNewOrgCorraccount').value.trim();

      await saveClient(client);
      state.clients.push(client);
      formDiv.remove();
      state.clientTypeFilter = type === 'org' ? 'org' : 'person';
      state.openClientId = client.id;

  function renderClientDetail(wrap, clientId){
    var client = getClientById(clientId);
    if(!client){ state.openClientId = null; renderClientsTab(); return; }

    var cars = carsOfClient(clientId);
    var stats = clientStats(clientId);

    var isOrg = client.type === 'org';
    var html = '<div class="breadcrumb"><a id="bcClients">Клиенты</a><span class="sep">/</span><span class="current">' + escapeHtml(displayClientName(client)) + '</span></div>';

    html += '<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;">' +
      '<button class="btn btn-ghost btn-sm" id="btnEditClientReqs">✎ Редактировать</button>' +
      '<button class="btn btn-danger btn-sm" id="btnDeleteClient">🗑 Удалить клиента</button>' +
    '</div>';

    html += '<div class="payroll-summary">' +
      '<div class="payroll-card"><div class="name">Телефон</div><div class="amount" style="font-size:16px;">' + escapeHtml(client.phone||'—') + '</div></div>' +
      '<div class="payroll-card"><div class="name">Визитов всего</div><div class="amount">' + stats.visitsCount + '</div></div>' +
      '<div class="payroll-card"><div class="name">Потрачено всего</div><div class="amount">' + fmtMoney(stats.totalSpent) + '</div></div>' +
    '</div>';

    if(isOrg){
      html += '<div class="form-section" style="background:var(--bg-panel-2);border-radius:10px;padding:14px 16px;margin-bottom:16px;">' +
        '<div class="form-section-title" style="margin-bottom:10px;">Реквизиты организации</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:13px;">' +
          '<div><span style="color:var(--text-subtle);">Организация</span><div style="margin-top:2px;">' + escapeHtml(client.orgName||'—') + '</div></div>' +
          '<div><span style="color:var(--text-subtle);">ИНН</span><div style="margin-top:2px;font-family:monospace;">' + escapeHtml(client.inn||'—') + '</div></div>' +
          '<div><span style="color:var(--text-subtle);">КПП</span><div style="margin-top:2px;font-family:monospace;">' + escapeHtml(client.kpp||'—') + '</div></div>' +
          '<div><span style="color:var(--text-subtle);">Юр. адрес</span><div style="margin-top:2px;">' + escapeHtml(client.legalAddress||'—') + '</div></div>' +
          '<div><span style="color:var(--text-subtle);">Банк</span><div style="margin-top:2px;">' + escapeHtml(client.bank||'—') + '</div></div>' +
          '<div><span style="color:var(--text-subtle);">БИК</span><div style="margin-top:2px;font-family:monospace;">' + escapeHtml(client.bik||'—') + '</div></div>' +
          '<div><span style="color:var(--text-subtle);">Расчётный счёт</span><div style="margin-top:2px;font-family:monospace;overflow-wrap:anywhere;">' + escapeHtml(client.account||'—') + '</div></div>' +
          '<div><span style="color:var(--text-subtle);">Корреспондентский счёт</span><div style="margin-top:2px;font-family:monospace;overflow-wrap:anywhere;">' + escapeHtml(client.corraccount||'—') + '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="form-section" style="background:var(--bg-panel-2);border-radius:10px;padding:14px 16px;margin:-6px 0 16px;">' +
        '<div class="form-section-title" style="margin-bottom:10px;">Договор</div>' +
        '<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">' +
          '<div style="flex:1;min-width:220px;">' +
            '<label class="form-label" for="orgContractNumber">Номер договора</label>' +
            '<input class="form-control" id="orgContractNumber" value="' + escapeHtml(client.contractNumber||'') + '" placeholder="Например: 15/2026 или Д-001">' +
          '</div>' +
          '<button class="btn btn-primary btn-sm" id="btnSaveContractNumber">Сохранить номер</button>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--text-subtle);margin-top:7px;">Номер автоматически добавляется в заголовки заказ-наряда, акта и счёта.</div>' +
      '</div>';
    }

    html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;">' +
      '<div class="form-section-title" style="margin:0;">Автомобили клиента</div>' +
      (isOrg ? '<button class="btn btn-primary btn-sm" id="btnAddOrgVehicle">+ Добавить авто</button>' : '') +
    '</div>';

    if(cars.length === 0){
      html += '<div class="clients-empty">У этого клиента пока нет привязанных автомобилей</div>';
    } else {
      cars.forEach(function(car){
        var visits = vehicleVisitHistory(car.id);
        var lastVisit = visits.length ? visits[visits.length-1] : null;
        var lastMileage = lastVisit ? lastVisit.mileage : null;
        html += '<div class="vehicle-card" data-vehicle-id="' + car.id + '">' +
          '<div class="vehicle-card-head">' +
            '<div class="vehicle-card-name">' + escapeHtml([car.carMake, car.carModel].filter(Boolean).join(' ')||'Автомобиль') + '</div>' +
            '<div class="vehicle-card-plate">' + escapeHtml(car.plate||'—') + '</div>' +
          '</div>' +
          '<div class="vehicle-card-meta">' +
            '<span>VIN: ' + escapeHtml(car.vin||'—') + '</span>' +
            '<span>Визитов: ' + visits.length + '</span>' +
            (lastMileage ? '<span>Последний пробег: ' + escapeHtml(lastMileage) + ' км</span>' : '') +
          '</div>' +
        '</div>';
      });
    }

    wrap.innerHTML = html;

    document.getElementById('bcClients').addEventListener('click', function(){
      state.openClientId = null;
      renderClientsTab();
    });

    document.getElementById('btnEditClientReqs').addEventListener('click', function(){
      openClientReqsForm(wrap, client);
    });
    var saveContractBtn = document.getElementById('btnSaveContractNumber');
    if(saveContractBtn){
      saveContractBtn.addEventListener('click', async function(){
        var input = document.getElementById('orgContractNumber');
        var updatedClient = Object.assign({}, client, { contractNumber: input ? input.value.trim() : '', updatedAt: Date.now() });
        saveContractBtn.disabled = true;
        var ok = await saveClient(updatedClient);
        if(!ok){ saveContractBtn.disabled = false; showToast('Не удалось сохранить номер договора'); return; }
        var idx = state.clients.findIndex(function(item){ return item.id === updatedClient.id; });
        if(idx >= 0) state.clients[idx] = updatedClient;
        renderClientDetail(wrap, updatedClient.id);
        showToast('Номер договора сохранён');
      });
    }
    document.getElementById('btnDeleteClient').addEventListener('click', async function(){
      var linkedCars = carsOfClient(client.id);
      var linkedOrders = state.orders.filter(function(order){ return order.clientId === client.id; });
      var clientLabel = displayClientName(client);
      var promptText = 'Удалить клиента «' + clientLabel + '»? Автомобили (' + linkedCars.length +
        ') останутся в базе «Авто» без владельца. Заказ-наряды (' + linkedOrders.length +
        ') и их история останутся. Это действие нельзя отменить.';
      if(!window.confirm(promptText)) return;

      var deleteBtn = document.getElementById('btnDeleteClient');
      if(deleteBtn) deleteBtn.disabled = true;
      var detachedCars = [];
      try{
        for(var i=0;i<linkedCars.length;i++){
          var originalCar = linkedCars[i];
          var detachedCar = Object.assign({}, originalCar, { clientId:null, updatedAt:Date.now() });
          detachedCars.push({ original:originalCar, detached:detachedCar });
          var saved = await saveCar(detachedCar);
          if(!saved) throw new Error('Не удалось отвязать автомобиль от клиента');
        }
        await localStore.delete('client:' + client.id);
        detachedCars.forEach(function(entry){
          var idx = state.cars.findIndex(function(car){ return car.id === entry.detached.id; });
          if(idx >= 0) state.cars[idx] = entry.detached;
        });
        state.clients = state.clients.filter(function(item){ return item.id !== client.id; });
        state.openClientId = null;
        state.clientTypeFilter = client.type === 'org' ? 'org' : 'person';
        renderClientsTab();
        showToast('Клиент удалён. Автомобили и заказ-наряды сохранены.');
      }catch(e){
        console.error(e);
        for(var j=0;j<detachedCars.length;j++){
          try{ await saveCar(detachedCars[j].original); }catch(rollbackError){ console.error(rollbackError); }
        }
        if(deleteBtn) deleteBtn.disabled = false;
        showToast('Не удалось удалить клиента. Проверьте соединение и попробуйте ещё раз.');
      }
    });
    var addOrgVehicleBtn = document.getElementById('btnAddOrgVehicle');
    if(addOrgVehicleBtn){
      addOrgVehicleBtn.addEventListener('click', function(){
        openVehicleForm(null, client.id, 'clients');
      });
    }

    wrap.querySelectorAll('.vehicle-card').forEach(function(card){
      card.addEventListener('click', function(){
        state.openVehicleId = card.dataset.vehicleId;
        state.vehicleReturnTab = 'clients';
        renderClientsTab();
      });
    });
  }

  function renderVehicleDetail(wrap, vehicleId, sourceTab){
    sourceTab = sourceTab || state.vehicleReturnTab || 'clients';
    var car = getCarById(vehicleId);
    if(!car){
      state.openVehicleId = null;
      if(sourceTab === 'cars') renderCarsTab();
      else renderClientsTab();
      return;
    }

    var owner = car.clientId ? getClientById(car.clientId) : null;
    var visits = vehicleVisitHistory(vehicleId);
    var carLabel = [car.carMake, car.carModel].filter(Boolean).join(' ') || 'Автомобиль';

    var backLabel = sourceTab === 'cars' ? 'Авто' : 'Клиенты';
    var html = '<div class="breadcrumb">' +
      '<a id="bcVehicleBack">' + backLabel + '</a><span class="sep">/</span>' +
      (owner ? '<a id="bcClient">' + escapeHtml(displayClientName(owner)) + '</a><span class="sep">/</span>' : '') +
      '<span class="current">' + escapeHtml(carLabel) + ' · ' + escapeHtml(car.plate||'') + '</span>' +
    '</div>';

    html += '<div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:-4px 0 16px;">' +
      '<button class="btn btn-ghost btn-sm" id="btnEditVehicle">✎ Редактировать</button>' +
      '<button class="btn btn-danger btn-sm" id="btnDeleteVehicle">🗑 Удалить авто</button>' +
    '</div>';

    html += '<div class="payroll-summary">' +
      '<div class="payroll-card"><div class="name">Гос. номер</div><div class="amount" style="font-size:16px; font-family:\'JetBrains Mono\',monospace;">' + escapeHtml(car.plate||'—') + '</div></div>' +
      '<div class="payroll-card"><div class="name">VIN</div><div class="amount" style="font-size:14px; font-family:\'JetBrains Mono\',monospace;">' + escapeHtml(car.vin||'—') + '</div></div>' +
      '<div class="payroll-card"><div class="name">Текущий владелец</div><div class="amount" style="font-size:16px;">' + escapeHtml(owner ? displayClientName(owner) : '—') + '</div></div>' +
    '</div>';

    html += '<div class="form-section-title">История визитов (по пробегу)</div>';

    if(visits.length === 0){
      html += '<div class="clients-empty">Для этого автомобиля пока нет ни одного наряда</div>';
    } else {
      html += '<div class="visit-timeline">';
      visits.forEach(function(o, idx){
        var total = calcOrderTotal(o);
        var workNames = (o.lines||[]).filter(function(l){ return l.type === 'work' && l.name; }).map(function(l){ return l.name; });
        var summary = workNames.length ? workNames.slice(0,3).join(', ') + (workNames.length > 3 ? '…' : '') : 'Без указанных работ';
        html += '<div class="visit-item">' +
          '<div class="visit-dot-col"><div class="visit-dot"></div>' + (idx < visits.length-1 ? '<div class="visit-line"></div>' : '') + '</div>' +
          '<div class="visit-content">' +

  function compressStockPhoto(file){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        try{
          var maxSide = 1600;
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        }catch(e){
          URL.revokeObjectURL(url);
          reject(e);
        }
      };
      img.onerror = function(){
        URL.revokeObjectURL(url);
        reject(new Error('Не удалось прочитать фото'));
      };
      img.src = url;
    });
  }


  async function runLocalStockOcr(imageDataUrl, onProgress){
    if(!window.Tesseract || !window.Tesseract.createWorker){
      throw new Error('OCR-модуль не загрузился. Проверьте интернет и попробуйте ещё раз.');
    }

    var worker = await window.Tesseract.createWorker('rus+eng', 1, {
      logger: function(m){
        if(typeof onProgress === 'function' && m && typeof m.progress === 'number'){
          onProgress(m.status || '', m.progress);
        }
      }
    });

    try{
      try{
        await worker.setParameters({
          preserve_interword_spaces: '1'
        });
      }catch(_e){}
      var result = await worker.recognize(imageDataUrl);
      return (result && result.data && result.data.text) ? result.data.text : '';
    }finally{
      try{ await worker.terminate(); }catch(_e){}
    }
  }

  function parseStockOcrText(text){
    var lines = String(text||'')
      .replace(/\r/g,'')
      .split('\n')
      .map(function(s){ return s.replace(/\s+/g,' ').trim(); })
      .filter(function(s){ return s.length >= 2; });

    if(!lines.length){
      return [{ name:'Запчасть по фото', sku:'', quantity:1, costPrice:0 }];
    }

    var badName = /(внимание|производител|изготовител|сертифик|товар|адрес|телефон|website|www\.|eac|штрих|barcode|страна|упаков|гарант)/i;
    var partWords = /(подшип|фильтр|колод|ремень|свеч|амортиз|ступиц|рычаг|датчик|насос|проклад|втулк|шаров|наконеч|диск|сцеплен|ролик|сайлент|опор|радиатор|термостат|стартер|генератор|форсунк|катушк|ламп|пыльник|шрус|тормоз|масл|воздуш|топлив)/i;

    var candidates = [];
    lines.forEach(function(line, idx){
      if(/^(OE|SKF|FAG|OEM)\b/i.test(line)) return;
      var tokens = line.match(/[A-ZА-Я0-9][A-ZА-Я0-9._\/-]{3,}/g) || [];
      tokens.forEach(function(token){
        var clean = token.replace(/^[._\/-]+|[._\/-]+$/g,'');
        if(clean.length < 4 || clean.length > 30) return;
        var hasLetter = /[A-ZА-Я]/i.test(clean);
        var hasDigit = /\d/.test(clean);
        if(!hasDigit) return;
        if(/^\d{12,14}$/.test(clean)) return;
        var score = 0;
        if(hasLetter && hasDigit) score += 8;
        if(/[-._\/]/.test(clean)) score += 3;
        if(idx <= 2) score += 5;
        else if(idx <= 5) score += 2;
        if(clean.length >= 5 && clean.length <= 16) score += 2;
        candidates.push({ value:clean, lineIndex:idx, score:score });
      });
    });

    candidates.sort(function(a,b){ return b.score - a.score || a.lineIndex - b.lineIndex; });
    var skuInfo = candidates.length ? candidates[0] : { value:'', lineIndex:-1 };
    var sku = skuInfo.value || '';

    var name = '';
    if(skuInfo.lineIndex >= 0){
      for(var j=skuInfo.lineIndex+1; j<Math.min(lines.length, skuInfo.lineIndex+5); j++){
        var near = lines[j];
        if(badName.test(near)) continue;
        if(/[А-Яа-яЁё]/.test(near) && near.length >= 4 && near.length <= 80){
          name = near;
          if(partWords.test(near)) break;
        }
      }
    }

    if(!name){
      for(var k=0;k<lines.length;k++){
        if(partWords.test(lines[k]) && !badName.test(lines[k])){
          name = lines[k];
          break;
        }
      }
    }

    if(!name){
      for(var n=0;n<lines.length;n++){
        var line = lines[n];
        if(badName.test(line)) continue;
        if(/[А-Яа-яЁё]/.test(line) && line.length >= 4 && line.length <= 70){
          name = line;
          break;
        }
      }
    }

    if(!name) name = 'Запчасть по фото';

    var quantity = 1;
    var qtyMatch = String(text||'').match(/(?:кол-?во|количество|qty)\s*[:xх]?\s*(\d{1,4})/i);
    if(qtyMatch) quantity = Math.max(1, Number(qtyMatch[1]) || 1);

    var costPrice = 0;
    var pricePatterns = [
      /(?:цена|стоимость)\s*[:\-]?\s*(\d[\d\s]*(?:[.,]\d{1,2})?)\s*(?:₽|руб(?:\.|лей)?)/i,
      /(\d[\d\s]*(?:[.,]\d{2}))\s*(?:₽|руб(?:\.|лей)?)/i
    ];
    for(var p=0;p<pricePatterns.length;p++){
      var pm = String(text||'').match(pricePatterns[p]);
      if(pm){
        costPrice = Number(pm[1].replace(/\s/g,'').replace(',','.')) || 0;
        if(costPrice) break;
      }
    }

    return [{
      name: name.replace(/^[\-–—:]+|[\-–—:]+$/g,'').trim(),
      sku: sku,
      quantity: quantity,
      costPrice: costPrice
    }];
  }

          return;

          showToast('Добавлено позиций: ' + saved);
        }
      };

      console.error(e);
      var msg = e && e.message ? e.message : 'Не удалось распознать фото';
      status.textContent = msg;
      saveBtn.disabled = true;
    }
  }

  function payrollOrdersForPeriod(period){
    var done = state.orders.filter(function(o){
      return o.status === 'done' && o.dateOut;
    });
    if(period === 'all') return done;

    var now = new Date();
    var today = localDateKey(now);
    var daysBack = period === 'year' ? 364 : (period === 'month' ? 29 : (period === 'week' ? 6 : 0));
    var fromDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysBack);
    var from = localDateKey(fromDate);

    return done.filter(function(o){

  // Revenue/profit are counted only for orders with status "done" (issued), by their issue date (dateOut).
  function issuedRevenueOrders(){
    return state.orders.filter(function(o){ return o.status === 'done' && o.dateOut; });
  }

  function ordersInRange(fromStr, toStr){
    return issuedRevenueOrders().filter(function(o){ return o.dateOut >= fromStr && o.dateOut <= toStr; });
  }

  function revenueAndProfitFor(orders){
    var revenue = 0, commission = 0;
    orders.forEach(function(o){
      revenue += calcOrderTotal(o);
      commission += calcOrderCommissionTotal(o);
    });
    return { revenue: revenue, profit: revenue - commission, ordersCount: orders.length };
  }

  function pad2(n){ return String(n).padStart(2,'0'); }

  function crmPeriodStats(){
    var now = new Date();
    var todayStr2 = now.getFullYear() + '-' + pad2(now.getMonth()+1) + '-' + pad2(now.getDate());
    var monthStart = now.getFullYear() + '-' + pad2(now.getMonth()+1) + '-01';
    var yearStart = now.getFullYear() + '-01-01';

    var today = revenueAndProfitFor(ordersInRange(todayStr2, todayStr2));
    var month = revenueAndProfitFor(ordersInRange(monthStart, todayStr2));
    var year = revenueAndProfitFor(ordersInRange(yearStart, todayStr2));

    return { today: today, month: month, year: year };
  }

  // Build last 30 days of {label, revenue, profit}
  function crmDailySeries(){
    var days = [];
    var now = new Date();
    for(var i=29;i>=0;i--){
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      var key = d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
      days.push({ key: key, label: pad2(d.getDate()) + '.' + pad2(d.getMonth()+1) });
    }
    var byDay = {};
    issuedRevenueOrders().forEach(function(o){
      var key = o.dateOut;
      if(!byDay[key]) byDay[key] = [];
      byDay[key].push(o);
    });
    return days.map(function(d){
      var stats = revenueAndProfitFor(byDay[d.key] || []);
      return { label: d.label, revenue: stats.revenue, profit: stats.profit };
    });
  }

  // Build 12 months of current year: {label, revenue, profit}
  function crmMonthlySeries(){
    var now = new Date();
    var year = now.getFullYear();
    var monthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    var byMonth = {};
    issuedRevenueOrders().forEach(function(o){
      var ym = o.dateOut.slice(0,7); // YYYY-MM
      if(!byMonth[ym]) byMonth[ym] = [];
      byMonth[ym].push(o);
    });
    var result = [];
    for(var m=0;m<12;m++){
      var ym = year + '-' + pad2(m+1);
      var stats = revenueAndProfitFor(byMonth[ym] || []);
      result.push({ label: monthNames[m], revenue: stats.revenue, profit: stats.profit });
    }
    return result;
  }

  function renderCrmChart(){
    var container = document.getElementById('crmChartContainer');
    var series = state.crmChartMode === 'month' ? crmMonthlySeries() : crmDailySeries();

    var hasData = series.some(function(p){ return p.revenue > 0 || p.profit > 0; });
    if(!hasData){
      container.innerHTML = '<div class="crm-chart-empty">Пока нет выданных нарядов за этот период. График появится после выдачи первых заказов.</div>';
      return;
    }

    var maxVal = Math.max.apply(null, series.map(function(p){ return Math.max(p.revenue, p.profit); }));
    if(maxVal <= 0) maxVal = 1;

    var n = series.length;
    var barGroupWidth = state.crmChartMode === 'month' ? 56 : 26;
    var chartHeight = 220;
    var paddingBottom = 32;
    var paddingTop = 10;
    var chartWidth = Math.max(n * barGroupWidth, 320);
    var plotHeight = chartHeight - paddingBottom - paddingTop;

    var barW = state.crmChartMode === 'month' ? 16 : 8;
    var gap = state.crmChartMode === 'month' ? 4 : 3;

    var bars = '';
    series.forEach(function(p, i){
      var groupX = i * barGroupWidth + (barGroupWidth - (barW*2 + gap)) / 2;
      var revH = Math.round((p.revenue / maxVal) * plotHeight);
      var profH = Math.round((p.profit / maxVal) * plotHeight);
      var revY = paddingTop + (plotHeight - revH);
      var profY = paddingTop + (plotHeight - profH);

      bars += '<g class="crm-bar-group">' +
        '<title>' + escapeHtml(p.label) + ': выручка ' + fmtMoney(p.revenue) + ', прибыль ' + fmtMoney(p.profit) + '</title>' +
        '<rect x="' + groupX + '" y="' + revY + '" width="' + barW + '" height="' + revH + '" fill="var(--accent)" rx="2"></rect>' +
        '<rect x="' + (groupX + barW + gap) + '" y="' + profY + '" width="' + barW + '" height="' + profH + '" fill="var(--status-ready)" rx="2"></rect>' +
      '</g>';

      if(state.crmChartMode === 'month' || i % 5 === 0 || i === n-1){
        bars += '<text x="' + (groupX + barW + gap/2) + '" y="' + (chartHeight - 10) + '" font-size="10" fill="var(--text-subtle)" text-anchor="middle" font-family="JetBrains Mono, monospace">' + escapeHtml(p.label) + '</text>';
      }
    });

    var baselineY = paddingTop + plotHeight;
    var svg = '<div class="crm-chart-svg-wrap"><svg width="' + chartWidth + '" height="' + chartHeight + '" viewBox="0 0 ' + chartWidth + ' ' + chartHeight + '" class="crm-bar-tooltip">' +
      '<line x1="0" y1="' + baselineY + '" x2="' + chartWidth + '" y2="' + baselineY + '" stroke="var(--border)" stroke-width="1"></line>' +
      bars +
      '</svg></div>';

    container.innerHTML = svg;
  }

  function exportBackup(){
    var payload = {
      exportedAt: new Date().toISOString(),
      app: 'avtoservice-zakaz-naryady',
      version: 4,
      orders: state.orders,
      staff: state.staff,
      clients: state.clients,
      cars: state.cars,
      priceList: state.priceList,
      stockItems: state.stockItems,
      stockMarkupPct: state.stockMarkupPct
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = todayStr();
    a.href = url;
    a.download = 'avtoservice-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('Резервная копия сохранена в загрузки браузера');
  }

  function importBackupFile(file){
    var reader = new FileReader();
    reader.onload = async function(){
      var data;
      try{
        data = JSON.parse(reader.result);
      }catch(e){
        showToast('Файл повреждён или это не резервная копия в нужном формате');
        return;
      }
      if(!data || (!Array.isArray(data.orders) && !Array.isArray(data.staff))){
        showToast('Это не похоже на файл резервной копии этого приложения');
        return;
      }

      var box = document.createElement('div');
      box.style.cssText = 'position:fixed; inset:0; background:rgba(10,11,14,0.75); display:flex; align-items:center; justify-content:center; z-index:300; padding:16px;';
      box.innerHTML =
        '<div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:22px; max-width:420px;">' +
          '<div style="font-size:15px; font-weight:600; margin-bottom:8px;">Восстановить данные из файла?</div>' +
          '<div style="font-size:13.5px; color:var(--text-muted); margin-bottom:18px;">Будут загружены ' + (data.orders||[]).length + ' наряд(ов), ' + (data.staff||[]).length + ' сотрудник(ов), ' + (data.clients||[]).length + ' клиент(ов), ' + (data.cars||[]).length + ' автомобиль(ей), ' + (data.priceList||[]).length + ' позиция(й) прайс-листа и ' + (data.stockItems||[]).length + ' позиция(й) склада. Текущие данные в этом браузере будут заменены. Это действие нельзя отменить.</div>' +
          '<div style="display:flex; justify-content:flex-end; gap:10px;">' +
            '<button class="btn btn-ghost btn-sm" id="cancelImport">Отмена</button>' +
            '<button class="btn btn-primary btn-sm" id="okImport">Восстановить</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(box);
      document.getElementById('cancelImport').onclick = function(){ document.body.removeChild(box); };
      document.getElementById('okImport').onclick = async function(){
        document.body.removeChild(box);

        var prefixesToClear = ['order:', 'staff:', 'client:', 'car:', 'priceitem:', 'stockitem:'];
        for(var p=0;p<prefixesToClear.length;p++){
          var existing = await localStore.list(prefixesToClear[p]);
          if(existing && existing.keys){
            for(var i=0;i<existing.keys.length;i++){ await localStore.delete(existing.keys[i]); }
          }
        }

        var orders = Array.isArray(data.orders) ? data.orders : [];
        var staff = Array.isArray(data.staff) ? data.staff : [];
        var clients = Array.isArray(data.clients) ? data.clients : [];
        var cars = Array.isArray(data.cars) ? data.cars : [];
        var priceList = Array.isArray(data.priceList) ? data.priceList : [];
        var stockItems = Array.isArray(data.stockItems) ? data.stockItems : [];
        for(var k=0;k<orders.length;k++){
          if(orders[k] && orders[k].id){ await localStore.set('order:' + orders[k].id, JSON.stringify(orders[k])); }
        }
        for(var m=0;m<staff.length;m++){
          if(staff[m] && staff[m].id){ await localStore.set('staff:' + staff[m].id, JSON.stringify(staff[m])); }
        }
        for(var n=0;n<clients.length;n++){
          if(clients[n] && clients[n].id){ await localStore.set('client:' + clients[n].id, JSON.stringify(clients[n])); }
        }
        for(var q=0;q<cars.length;q++){
          if(cars[q] && cars[q].id){ await localStore.set('car:' + cars[q].id, JSON.stringify(cars[q])); }
        }
        for(var r=0;r<priceList.length;r++){
          if(priceList[r] && priceList[r].id){ await localStore.set('priceitem:' + priceList[r].id, JSON.stringify(priceList[r])); }
        }
        for(var t=0;t<stockItems.length;t++){
          if(stockItems[t] && stockItems[t].id){ await localStore.set('stockitem:' + stockItems[t].id, JSON.stringify(stockItems[t])); }
        }
        if(data.stockMarkupPct !== undefined && data.stockMarkupPct !== null){
          try{ await localStore.set('meta:stockMarkupPct', String(data.stockMarkupPct)); }catch(e){}
        }
        // mark migration/seeding as done since we either restored a backup that already has this data,
        // or an old backup without it — either way, avoid unexpected automatic rebuilding afterwards.
        try{ await localStore.set('meta:clientsMigrated', '1'); }catch(e){}
        try{ await localStore.set('meta:priceListSeeded', '1'); }catch(e){}

        await loadStaff();
        await loadOrders();
        await loadClients();
        await loadCars();
        await loadPriceList();
        await loadStockItems();
        await loadStockMarkup();
        if(clients.length === 0 && cars.length === 0){
          // old-format backup: rebuild clients/cars from the restored orders
          try{ await localStore.delete('meta:clientsMigrated'); }catch(e){}
          await migrateLegacyOrdersToClients();
          await loadClients();
          await loadCars();
        }
        if(priceList.length === 0){
          // backup predates the price list feature: seed starter jobs
          try{ await localStore.delete('meta:priceListSeeded'); }catch(e){}
          await seedDefaultPriceListIfNeeded();
          await loadPriceList();
        }
        switchTab(state.activeTab);
        showToast('Данные восстановлены');
      };
    };
    reader.onerror = function(){
      showToast('Не удалось прочитать файл');
    };
    reader.readAsText(file);
  }

        '</div>' +
        '<div class="form-section-title" style="margin:6px 0 -4px;">Банковские реквизиты</div>' +
        '<div class="form-group"><label class="form-label">Банк</label>' +
          '<input class="form-control" id="setCBank" value="' + escapeHtml(c.bank||'') + '" placeholder="ПАО «Сбербанк»"></div>' +
        '<div class="form-group"><label class="form-label">БИК</label>' +
          '<input class="form-control" id="setCBik" value="' + escapeHtml(c.bik||'') + '" placeholder="044525225"></div>' +
        '<div class="form-group"><label class="form-label">Расчётный счёт</label>' +
          '<input class="form-control" id="setCAccount" value="' + escapeHtml(c.account||'') + '" placeholder="40702810000000000000"></div>' +
        '<div class="form-group"><label class="form-label">Корр. счёт</label>' +
          '<input class="form-control" id="setCCorr" value="' + escapeHtml(c.corraccount||'') + '" placeholder="30101810400000000225"></div>' +
        '<div><button class="btn btn-primary" id="btnSaveCompany">Сохранить</button></div>' +
      '</div>' +

      '<div style="margin-top:28px;max-width:460px;">' +
        '<h2 style="margin:0 0 4px;font-size:18px;">Данные и резервные копии</h2>' +
        '<div style="font-size:13px;color:var(--text-subtle);margin-bottom:18px;">Экспорт и импорт всех данных приложения</div>' +
        '<div class="settings-card" style="display:flex;flex-direction:column;gap:10px;">' +
          '<button class="btn btn-ghost" id="btnRefresh" style="justify-content:flex-start;gap:10px;">↻&nbsp; Обновить данные</button>' +
          '<button class="btn btn-ghost" id="btnExport" style="justify-content:flex-start;gap:10px;">⬇&nbsp; Скачать резервную копию</button>' +
          '<button class="btn btn-ghost" id="btnImport" style="justify-content:flex-start;gap:10px;">⬆&nbsp; Восстановить из файла</button>' +
        '</div>' +
      '</div>';
    document.getElementById('btnRefresh').addEventListener('click', async function(){
      showToast('Обновление данных…');
      await loadStaff();
      await loadClients();
      await loadCars();
      await loadPriceList();
      await loadStockItems();
      await loadStockMarkup();
      await loadOrders();
      showToast('Данные обновлены');
    });
    document.getElementById('btnExport').addEventListener('click', function(){
      exportBackup();
    });
    document.getElementById('btnImport').addEventListener('click', function(){
      document.getElementById('importFileInput').click();
    });

    document.getElementById('btnSaveCompany').addEventListener('click', async function(){
      state.company.name       = document.getElementById('setCName').value.trim();
      state.company.phone      = document.getElementById('setCPhone').value.trim();
      state.company.address    = document.getElementById('setCAddress').value.trim();
      state.company.inn        = document.getElementById('setCInn').value.trim();
      state.company.kpp        = document.getElementById('setCKpp').value.trim();
      state.company.bank       = document.getElementById('setCBank').value.trim();
      state.company.bik        = document.getElementById('setCBik').value.trim();
      state.company.account    = document.getElementById('setCAccount').value.trim();
      state.company.corraccount= document.getElementById('setCCorr').value.trim();
      await saveCompany();
    });
  }

  async function init(){
    await loadCompany();
    await loadStaff();
    await loadOrders();
    await loadClients();
    await loadCars();
    await migrateLegacyOrdersToClients();
    await loadClients();
    await loadCars();
    await loadPriceList();
    await seedDefaultPriceListIfNeeded();
    await loadStockItems();
    await loadStockMarkup();
    if(state.activeTab === 'clients'){ renderClientsTab(); }
    if(state.activeTab === 'pricelist'){ renderPriceListTab(); }
    if(state.activeTab === 'stock'){ renderStockTab(); }
    startRealtimeSync();
  }

  // ---------- Auth ----------

  function showApp(){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = '';
    init();
  }

  function showAuthScreen(){
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appRoot').style.display = 'none';
  }

  document.getElementById('authSubmit').addEventListener('click', async function(){
    var email = (document.getElementById('authEmail').value||'').trim();
    var password = document.getElementById('authPassword').value||'';
    var errEl = document.getElementById('authError');
    var loadEl = document.getElementById('authLoading');
    errEl.style.display = 'none';
    if(!email || !password){ errEl.textContent = 'Введите email и пароль.'; errEl.style.display = 'block'; return; }
    document.getElementById('authSubmit').style.display = 'none';
    loadEl.style.display = 'block';
    var result = await getSB().auth.signInWithPassword({ email: email, password: password });
    loadEl.style.display = 'none';
    document.getElementById('authSubmit').style.display = 'block';
    if(result.error){
      errEl.textContent = result.error.message === 'Invalid login credentials' ? 'Неверный email или пароль' : result.error.message;
      errEl.style.display = 'block';
      return;
    }
    showApp();
  });

  document.getElementById('authPassword').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('authSubmit').click();
  });

  document.getElementById('btnTheme').addEventListener('click', toggleTheme);
    document.getElementById('btnExportCSV').addEventListener('click', exportOrdersCSV);
    document.getElementById('btnExportPayroll').addEventListener('click', exportPayrollCSV);
    initTheme();
    updateHeaderClock();
    setInterval(updateHeaderClock, 1000);
    document.getElementById('btnLogout').addEventListener('click', async function(){
    stopRealtimeSync();
    await getSB().auth.signOut();
    showAuthScreen();
    showToast('Вы вышли из системы');
  });

  getSB().auth.onAuthStateChange(function(event, session){
    if(event === 'SIGNED_OUT' || event === 'USER_DELETED'){ showAuthScreen(); }
    if(event === 'TOKEN_REFRESHED' && !session){ showAuthScreen(); }
  });

  getSB().auth.getSession().then(function(result){
    if(result.data && result.data.session){ showApp(); }
    else { showAuthScreen(); }
  });

})();
</script>
</body>
</html>
